, "title": "Somatic HRAS p.G12S mutation causes woolly hair and epidermal nevi.", "abstract": "", "pub_types": ["Letter", "Research Support, Non-U.S. Gov't", "research-article", "Case Reports", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Somatic HRAS p.G12S mutation causes woolly hair and epidermal nevi.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "19622105", "year": 2009, "date": "2009-06-23", "title": "Protein tyrosine phosphatase SHP-2: a proto-oncogene product that promotes Ras activation.", "abstract": "SHP-2 is a cytoplasmic protein tyrosine phosphatase (PTP) that contains two Src homology 2 (SH2) domains. Although PTPs are generally considered to be negative regulators on the basis of their ability to oppose the effects of protein tyrosine kinases, SHP-2 is unusual in that it promotes the activation of the Ras-MAPK signaling pathway by receptors for various growth factors and cytokines. The molecular basis for the activation of SHP-2 is also unique: In the basal state, the NH(2)-terminal SH2 domain of SHP-2 interacts with the PTP domain, resulting in autoinhibition of PTP activity; the binding of SHP-2 via its SH2 domains to tyrosine-phosphorylated growth factor receptors or docking proteins, however, results in disruption of this intramolecular interaction, leading to exposure of the PTP domain and catalytic activation. Indeed, SHP-2 proteins with artificial mutations in the NH(2)-terminal SH2 domain have been shown to act as dominant active mutants in vitro. Such activating mutations of PTPN11 (human SHP-2 gene) were subsequently identified in individuals with Noonan syndrome, a human developmental disorder that is sometimes associated with juvenile myelomonocytic leukemia. Furthermore, somatic mutations of PTPN11 were found to be associated with pediatric leukemia. SHP-2 is also thought to participate in the development of other malignant disorders, but in a manner independent of such activating mutations. Biochemical and functional studies of SHP-2 and genetic analysis of PTPN11 in human disorders have thus converged to provide new insight into the pathogenesis of cancer as well as potential new targets for cancer treatment.", "pub_types": ["review-article", "Review", "Journal Article"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "SHP-2 is a cytoplasmic protein tyrosine phosphatase (PTP) that contains two Src homology 2 (SH2) domains.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "17453145", "year": 2007, "date": "2007-07-01", "title": "How do Shp2 mutations that oppositely influence its biochemical activity result in syndromes with overlapping symptoms?", "abstract": "Activating and inactivating mutations of SHP-2 are responsible, respectively, for the Noonan (NS) and the LEOPARD (LS) syndromes. Clinically, these developmental disorders overlap greatly, resulting in the apparent paradox of similar diseases caused by mutations that oppositely influence SHP-2 phosphatase activity. While the mechanisms remain unclear, recent functional analysis of SHP-2, along with the identification of other genes involved in NS and in other related syndromes (neurofibromatosis-1, Costello and cardio-facio-cutaneous syndromes), strongly suggest that Ras/MAPK represents the major signaling pathway deregulated by SHP-2 mutants. We discuss the idea that, with the exception of LS mutations that have been shown to exert a dominant negative effect, all disease-causing mutations involved in Ras/MAPK-mediated signaling, including SHP-2, might lead to enhanced MAPK activation. This suggests that a narrow range of MAPK signaling is required for appropriate development. We also discuss the possibility that LS mutations may not simply exhibit dominant negative activity.", "pub_types": ["Research Support, Non-U.S. Gov't", "review-article", "Review", "Journal Article"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Activating and inactivating mutations of SHP-2 are responsible, respectively, for the Noonan (NS) and the LEOPARD (LS) syndromes.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "16983387", "year": 2006, "date": "2006-10-01", "title": "Therapeutic intervention based on protein prenylation and associated modifications.", "abstract": "In eukaryotic cells, a specific set of proteins are modified by C-terminal attachment of 15-carbon farnesyl groups or 20-carbon geranylgeranyl groups that function both as anchors for fixing proteins to membranes and as molecular handles for facilitating binding of these lipidated proteins to other proteins. Additional modification of these prenylated proteins includes C-terminal proteolysis and methylation, and attachment of a 16-carbon palmitoyl group; these modifications augment membrane anchoring and alter the dynamics of movement of proteins between different cellular membrane compartments. The enzymes in the protein prenylation pathway have been isolated and characterized. Blocking protein prenylation is proving to be therapeutically useful for the treatment of certain cancers, infection by protozoan parasites and the rare genetic disease Hutchinson-Gilford progeria syndrome.", "pub_types": ["research-article", "Review", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "In eukaryotic cells, a specific set of proteins are modified by C-terminal attachment of 15-carbon farnesyl groups or 20-carbon geranylgeranyl groups that function both as anchors for fixing proteins to membranes and as molecular handles for facilitating binding of these lipidated proteins to other proteins.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "16825433", "year": 2006, "date": "2006-07-06", "title": "The cardiofaciocutaneous syndrome.", "abstract": "The cardiofaciocutaneous (CFC) syndrome is a condition of sporadic occurrence, with patients showing multiple congenital anomalies and mental retardation. It is characterised by failure to thrive, relative macrocephaly, a distinctive face with prominent forehead, bitemporal constriction, absence of eyebrows, hypertelorism, downward-slanting palpebral fissures often with epicanthic folds, depressed nasal root and a bulbous tip of the nose. The cutaneous involvement consists of dry, hyperkeratotic, scaly skin, sparse and curly hair, and cavernous haemangiomata. Most patients have a congenital heart defect, most commonly pulmonic stenosis and hypertrophic cardiomyopathy. The developmental delay usually is moderate to severe. The syndrome is caused by gain-of-function mutations in four different genes BRAF, KRAS, mitogen-activated protein/extracellular signal-regulated kinase MEK1 and MEK2, all belonging to the same RAS-extracellular signal-regulated kinase (ERK) pathway that regulates cell differentiation, proliferation and apoptosis. The CFC syndrome is a member of a family of syndromes that includes the Noonan and Costello syndromes, presenting with phenotypic similarities. Noonan syndrome is caused by mutations in the protein tyrosine phosphatase SHP-2 gene (PTPN11), with a few people having a mutation in KRAS. Costello syndrome is caused by mutations in HRAS. The protein products of these genes also belong to the RAS-ERK pathway. Thus, the clinical overlap of these three conditions, which often poses a problem of differential diagnosis, is explained by their pathogenetic relatedness.", "pub_types": ["review-article", "Review", "Journal Article"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "The cardiofaciocutaneous (CFC) syndrome is a condition of sporadic occurrence, with patients showing multiple congenital anomalies and mental retardation.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "17211612", "year": 2007, "date": "2007-01-09", "title": "An unexpected new role of mutant Ras: perturbation of human embryonic development.", "abstract": "The Ras signaling pathway controls important cellular responses to growth factors, and somatic mutations in RAS genes and other components of the Ras pathway, such as PTPN11 (encoding the protein-tyrosine phosphatase SHP-2) and BRAF, are found in human malignancies. Ras proteins are guanosine nucleotide-binding proteins that cycle between active guanosine triphosphate (GTP)-bound and inactive guanosine diphosphate (GDP)-bound conformations. Neoplasia-associated Ras mutations frequently affect amino acids G12, G13, or Q61 and decrease the intrinsic guanosine triphosphatase (GTPase) activity by ten- to twentyfold. The GTPase activity is crucial for Ras inactivation by hydrolysis and release of a phosphate group from Ras.GTP to produce Ras.GDP. We and others have recently discovered germline mutations in the KRAS gene in individuals diagnosed with Noonan and cardio-facio-cutaneous (CFC) syndrome, two clinically overlapping disorders characterized by short stature, distinct facial anomalies, heart defects, and other abnormalities. Noonan syndrome-associated mutations V14I and T58I K-Ras activate Ras but have milder biochemical effects than somatic mutations encountered in cancers, offering an explanation why these K-Ras lesions are tolerated during embryonic development. Together with recent findings of BRAF, MEK1, and MEK2 mu let filter = "all";

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function highlight(text, terms) {
  let html = esc(text);
  (terms || []).forEach((term) => {
    const bare = String(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (!bare) return;
    html = html.replace(new RegExp(bare, "ig"), (match) => `<mark>${match}</mark>`);
  });
  return html;
}

function papersFor(claim) {
  if (filter === "review") return claim.reviews || [];
  return (claim.neighbors || []).filter((paper) => {
    const types = paper.relationships.map((rel) => rel.type);
    if (filter === "all") return true;
    if (filter === "outside") return !paper.in_packet;
    if (filter === "combination") return (paper.in_budget || []).includes("combination");
    return types.includes(filter);
  });
}

      current = Number(button.dataset.index);

}

  document.getElementById("reading").innerHTML = `
    <p class="banner">These neighbors are for reading the evidence that followed the claim. They are not inputs for a forecast made on ${esc(claim.cutoff)}.</p>
    <p class="kicker">${esc(claim.claim_id)} · ${esc(claim.spec.gene)} · ${esc(claim.stratum || "claim").replaceAll("_", " ")}</p>
    <h1>${esc(claim.spec.outcome)}</h1>
    <p class="quote">${esc(claim.spec.quote)}</p>
    <dl class="spec">
      <dt>Intervention</dt><dd>${esc(claim.spec.intervention)}</dd>
      <dt>Setting</dt><dd>${esc(claim.spec.setting)}</dd>
      <dt>Outcome</dt><dd>${esc(claim.spec.outcome)}</dd>
      <dt>Direction</dt><dd>${esc(claim.spec.direction)}</dd>
      <dt>Source</dt><dd>PMID ${esc(claim.pmid)} · cutoff ${esc(claim.cutoff)} · horizon ${8} years</dd>
    </dl>
    <p class="meta">A paper that cites the source can still be about something else. An experimental match can be an independent test that never cites it. A review can repeat the conclusion without a new experiment.${yearNote}</p>
    <div class="filters">${counts}</div>
    ${cards || `<p class="empty">No papers in this group.</p>`}
  `;
  document.querySelectorAll(".filters button").forEach((button) => {
    button.addEventListener("click", () => {
      filter = button.dataset.filter;
      render();
    });
  });
}

render();
</script>
</body>
</html>
