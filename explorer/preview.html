r processing pathways and localize to different membrane microdomains or subcellular compartments; 5) the different phenotypes displayed by genetically modified animal strains for each of the 3 ras loci; and 6) the specific transcriptional networks controlled by each isoform in different cellular settings.", "pub_types": ["research-article", "Journal Article"], "relationships": [{"type": "citation", "rank": 8, "why": "Cites PMID 16372351. The abstract does not state the claim's setting or focus terms.", "passage": "H-ras, N-ras, and K-ras are canonical ras gene family members frequently activated by point mutation in human cancers and coding for 4 different, highly related protein isoforms (H-Ras, N-Ras, K-Ras4A, and K-Ras4B).", "matched_terms": []}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "21779504", "year": 2011, "date": "2011-03-01", "title": "Ras in cancer and developmental diseases.", "abstract": "Somatic, gain-of-function mutations in ras genes were the first specific genetic alterations identified in human cancer about 3 decades ago. Studies during the last quarter century have characterized the Ras proteins as essential components of signaling networks controlling cellular proliferation, differentiation, or survival. The oncogenic mutations of the H-ras, N-ras, or K-ras genes frequently found in human tumors are known to throw off balance the normal outcome of those signaling pathways, thus leading to tumor development. Oncogenic mutations in a number of other upstream or downstream components of Ras signaling pathways (including membrane RTKs or cytosolic kinases) have been detected more recently in association with a variety of cancers. Interestingly, the oncogenic Ras mutations and the mutations in other components of Ras/MAPK signaling pathways appear to be mutually exclusive events in most tumors, indicating that deregulation of Ras-dependent signaling is the essential requirement for tumorigenesis. In contrast to sporadic tumors, separate studies have identified germline mutations in Ras and various other components of Ras signaling pathways that occur in specific association with a number of different familial, developmental syndromes frequently sharing common phenotypic cardiofaciocutaneous features. Finally, even without being a causative force, defective Ras signaling has been cited as a contributing factor to many other human illnesses, including diabetes and immunological and inflammatory disorders. We aim this review at summarizing and updating current knowledge on the contribution of Ras mutations and altered Ras signaling to development of various tumoral and nontumoral pathologies.", "pub_types": ["research-article", "Journal Article"], "relationships": [{"type": "experimental", "rank": 5, "why": "Experimental query matched the structured query.", "passage": "Somatic, gain-of-function mutations in ras genes were the first specific genetic alterations identified in human cancer about 3 decades ago.", "matched_terms": []}], "in_packet": false, "in_budget": ["experimental"]}, {"pmid": "21834037", "year": 2011, "date": "2011-08-10", "title": "Molecular confirmation of HRAS p.G12S in siblings with Costello syndrome.", "abstract": "Costello syndrome was first reported based on its characteristic phenotype. Its presentation affects multiple organ systems, including severe failure-to-thrive with macrocephaly, characteristic facial features, hypertrophic cardiomyopathy, papillomata, malignant tumors, and cognitive impairment. Heterozygous germline mutations in the proto-oncogene HRAS have been recognized to cause Costello syndrome, and its inheritance pattern would thus be autosomal dominant. Here, we report on the identification of an HRAS mutation c.34G>A, predicting a p.G12S amino acid substitution, in the surviving brother of a previously reported sibling pair, and documentation of the same change in autopsy material from his deceased sister. This represents, to our knowledge, the first molecularly confirmed Costello syndrome in siblings. We did not detect the mutation in a heterozygous state or mosaicism in peripheral white blood cell or cheek swab-derived DNA samples from either parent. Using single nucleotide polymorphic markers and allele-specific amplification, we clearly identified the mutation in the surviving sibling to be of maternal origin. While we cannot exclude two independently occurring de novo mutations, the complete sharing of polymorphic markers around the mutation site in both siblings supports maternal germ cell mosaicism. Recurrence risk counseling for families with apparently de novo occurring autosomal dominant conditions includes discussion of germ cell mosaicism, and this report underscores the applicability of this concern to Costello syndrome.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Case Reports", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "text_similarity", "rank": 2, "why": "Cosine 0.97 between this abstract and the claim statement.", "passage": "Heterozygous germline mutations in the proto-oncogene HRAS have been recognized to cause Costello syndrome, and its inheritance pattern would thus be autosomal dominant.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["combination", "text_similarity"]}, {"pmid": "21850009", "year": 2011, "date": "2011-08-18", "title": "HRAS mutants identified in Costello syndrome patients can induce cellular senescence: possible implications for the pathogenesis of Costello syndrome.", "abstract": "Costello syndrome (CS) is a congenital disease that is characterized by a distinctive facial appearance, failure to thrive, mental retardation and cardiomyopathy. In 2005, we discovered that heterozygous germline mutations in HRAS caused CS. Several studies have shown that CS-associated HRAS mutations are clustered in codons 12 and 13, and mutations in other codons have also been identified. However, a comprehensive comparison of the substitutions identified in patients with CS has not been conducted. In the current study, we identified four mutations (p.G12S, p.G12A, p.G12C and p.G12D) in 21 patients and analyzed the associated clinical manifestations of CS in these individuals. To examine functional differences among the identified mutations, we characterized a total of nine HRAS mutants, including seven distinct substitutions in codons 12 and 13, p.K117R and p.A146T. The p.A146T mutant demonstrated the weakest Raf-binding activity, and the p.K117R and p.A146T mutants had weaker effects on downstream c-Jun N-terminal kinase signaling than did codon 12 or 13 mutants. We demonstrated that these mutant HRAS proteins induced senescence when overexpressed in human fibroblasts. Oncogene-induced senescence is a cellular reaction that controls cell proliferation in response to oncogenic mutation and it has been considered one of the tumor suppression mechanisms in vivo. Our findings suggest that the HRAS mutations identified in CS are sufficient to cause oncogene-induced senescence and that cellular senescence might therefore contribute to the pathogenesis of CS.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article"], "relationships": [{"type": "experimental", "rank": 4, "why": "Experimental query matched HRAS, Costello, codon 12.", "passage": "Costello syndrome (CS) is a congenital disease that is characterized by a distinctive facial appearance, failure to thrive, mental retardation and cardiomyopathy.", "matched_terms": ["HRAS", "Costello", "codon 12"]}], "in_packet": false, "in_budget": ["combination", "experimental"]}, {"pmid": "22317973", "year": 2012, "date": "2012-02-08", "title": "C4ST-1/CHST11-controlled chondroitin sulfation interferes with oncogenic HRAS signaling in Costello syndrome.", "abstract": "Costello syndrome is a pediatric genetic disorder linked to oncogenic germline mutations in the HRAS gene. The disease is characterized by multiple developmental abnormalities, as well as predisposition to malignancies. Our recent observation that heart tissue from patients with Costello syndrome showed a loss of the glycosaminoglycan chondroitin-4-sulfate (C4S) inspired our present study aimed to explore a functional involvement of the chondroitin sulfate (CS) biosynthesis gene Carbohydrate sulfotransferase 11/Chondroitin-4-sulfotransferase-1 (CHST11/C4ST-1), as well as an impaired chondroitin sulfation balance, as a downstream mediator of oncogenic HRAS in Costello syndrome. Here we demonstrate a loss of C4S, as well as a reduction in C4ST-1 mRNA and protein expression, in primary fibroblasts from Costello syndrome patients. We go on to show that expression of oncogenic HRAS in normal fibroblasts can repress C4ST-1 expression, whereas interference with oncogenic HRAS signaling in Costello syndrome fibroblasts elevated C4ST-1 expression, thus identifying C4ST-1 as a negatively regulated target gene of HRAS signaling. Importantly, we show that forced expression of C4ST-1 in Costello fibroblasts could rescue the proliferation and elastogenesis defects associated with oncogenic HRAS signaling in these cells. Our results indicate reduced C4ST-1 expression and chondroitin sulfation imbalance mediating the effects of oncogenic HRAS signaling in the pathogenesis of Costello syndrome. Thus, our work identifies C4ST-1-dependent chondroitin sulfation as a downstream vulnerability in oncogenic RAS signaling, which might be pharmacologically exploited in future treatments of not only Costello syndrome and other RASopathies, but also human cancers associated with activating RAS mutations.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article"], "relationships": [{"type": "citation", "rank": 12, "why": "Cites PMID 16372351. Matched terms: HRAS, Costello.", "passage": "Costello syndrome is a pediatric genetic disorder linked to oncogenic germline mutations in the HRAS gene.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "22488832", "year": 2012, "date": "2012-04-09", "title": "Transmission of the rare HRAS mutation (c. 173C > T; p.T58I) further illustrates its attenuated phenotype.", "abstract": "Costello syndrome was delineated based on its distinctive phenotype including severe failure-to-thrive with macrocephaly, characteristic facial features, hypertrophic cardiomyopathy, papillomata, malignant tumors, and cognitive impairment. Heterozygous germline mutations in the proto-oncogene HRAS cause Costello syndrome, and its inheritance pattern would thus be autosomal dominant. With exception of two instances of parental mosaicism, one presumed gonadal and the other proven somatic mosaicism for the p.G12S change, all published cases resulted from de novo mutations, typically arising in the paternal germline. More than 90% of these mutations affect the glycine residues in position 12 or 13, and result in a gain-of-function of the altered protein. A rare heterozygous HRAS alteration (c.173C > T; p.T58I) associated with an attenuated phenotype was previously reported in one patient. We identified two additional individuals with this mutation, father and son. Further studies supported origin of the alteration in the grand-paternal germline. Transmission of the mutation underscores its attenuated phenotype compatible with reproduction. We reviewed the phenotype in the newly identified individuals (Patient 1, 2) and include updated information on the first previously reported individual with HRAS p.T58I (Patient 3). Macrocephaly was present in all three. Cardiac findings included hypertrophic cardiomyopathy with double-chambered right ventricle; or mitral valve prolapse in one patient each. While subtle neurologic abnormalities or developmental delay were present in all, only one showed significant cognitive and functional impairment. None developed papillomata or a malignant tumor. Genetic counseling for Costello syndrome needs to take into consideration the particular HRAS mutation.", "pub_types": ["research-article", "Journal Article", "Case Reports", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "text_similarity", "rank": 4, "why": "Cosine 0.96 between this abstract and the claim statement.", "passage": "Heterozygous germline mutations in the proto-oncogene HRAS cause Costello syndrome, and its inheritance pattern would thus be autosomal dominant.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}, {"pmid": "22821884", "year": 2012, "date": "2012-07-20", "title": "A novel HRAS substitution (c.266C>G; p.S89C) resulting in decreased downstream signaling suggests a new dimension of RAS pathway dysregulation in human development.", "abstract": "Costello syndrome is caused by HRAS germline mutations affecting Gly(12) or Gly(13) in >90% of cases and these are associated with a relatively homogeneous phenotype. Rarer mutations in other HRAS codons were reported in patients with an attenuated or mild phenotype. Disease-associated HRAS missense mutations result in constitutive HRAS activation and increased RAF-MEK-ERK and PI3K-AKT signal flow. Here we report on a novel heterozygous HRAS germline alteration, c.266C>G (p.S89C), in a girl presenting with severe fetal hydrops and pleural effusion, followed by a more benign postnatal course. A sibling with the same mutation and fetal polyhydramnios showed a Dandy-Walker malformation; his postnatal course was complicated by severe feeding difficulties. Their apparently asymptomatic father is heterozygous for the c.266C>G change. By functional analyses we identified reduced levels of active HRAS(S89C) and diminished MEK, ERK and AKT phosphorylation in cells overexpressing HRAS(S89C) , which represent novel consequences of disease-associated HRAS mutations. Given our patients' difficult neonatal course and presence of this change in their asymptomatic father, we hypothesize that its harmful consequences may be time limited, with the late fetal stage being most sensitive. Alternatively, the phenotype may develop only in the presence of an additional as-yet-unknown genetic modifier. While the pathogenicity of the HRAS c.266C>G change remains unproven, our data may illustrate wide functional and phenotypic variability of germline HRAS mutations.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "text_similarity", "rank": 5, "why": "Cosine 0.96 between this abstract and the claim statement.", "passage": "Costello syndrome is caused by HRAS germline mutations affecting Gly(12) or Gly(13) in >90% of cases and these are associated with a relatively homogeneous phenotype.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}, {"pmid": "22926243", "year": 2012, "date": "2012-08-07", "title": "Two cases with severe lethal course of Costello syndrome associated with HRAS p.G12C and p.G12D.", "abstract": "Costello syndrome (CS) is a rare congenital disorder characterized by severe failure to thrive, coarse facial appearance, cardiac and skin abnormalities, developmental delay, intellectual disability, and predisposition to malignancies. Heterozygous de novo germline mutations in the proto-oncogene HRAS cause CS. About 80% of patients share the same mutation resulting in the amino acid change p.G12S and present a relatively homogeneous phenotype. Other less common lesions in HRAS can induce a milder phenotype on the one hand and a more severe phenotype on the other broadening the spectrum of clinical manifestations in CS-affected individuals. We report two new patients with the HRAS p.G12C and p.G12D substitutions and a severe neonatal manifestation causing death at the age of three months and 13 days, respectively. Both patients had particularly severe heart involvement with hypertrophic cardiomyopathy and tachyarrhythmia, generalized edema, and respiratory distress. In one case, hypertrophic cardiomyopathy was already noted prenatally. These cases together with other individuals harboring the rare HRAS mutations p.G12C, p.G12V, p.G12D, and p.G12E provide further evidence for a genotype-phenotype correlation that could be of importance for counseling and medical management.", "pub_types": ["Journal Article", "Case Reports"], "relationships": [{"type": "text_similarity", "rank": 6, "why": "Cosine 0.96 between this abstract and the claim statement.", "passage": "Costello syndrome (CS) is a rare congenital disorder characterized by severe failure to thrive, coarse facial appearance, cardiac and skin abnormalities, developmental delay, intellectual disability, and predisposition to malignancies.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}, {"pmid": "23079662", "year": 2012, "date": "2012-10-01", "title": "A mouse model of rhabdomyosarcoma originating from the adipocyte lineage.", "abstract": "Rhabdomyosarcoma (RMS) is an aggressive skeletal muscle-lineage tumor composed of malignant myoblasts that fail to exit the cell cycle and are blocked from fusing into syncytial muscle. Rhabdomyosarcoma includes two histolopathologic subtypes: alveolar rhabdomyosarcoma, driven by the fusion protein PAX3-FOXO1 or PAX7-FOXO1, and embryonal rhabdomyosarcoma (ERMS), which is genetically heterogeneous. Here, we show that adipocyte-restricted activation of Sonic hedgehog signaling through expression of a constitutively active Smoothened allele in mice gives rise to aggressive skeletal muscle tumors that display the histologic and molecular characteristics of human ERMS with high penetrance. Our findings suggest that adipocyte progenitors can be a cell of origin for Sonic hedgehog-driven ERMS, showing that RMS can originate from nonskeletal muscle precursors.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "citation", "rank": 13, "why": "Cites PMID 16372351. The abstract does not state the claim's setting or focus terms.", "passage": "Rhabdomyosarcoma (RMS) is an aggressive skeletal muscle-lineage tumor composed of malignant myoblasts that fail to exit the cell cycle and are blocked from fusing into syncytial muscle.", "matched_terms": []}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "23335589", "year": 2013, "date": "2013-01-17", "title": "Functional analysis of a duplication (p.E63_D69dup) in the switch II region of HRAS: new aspects of the molecular pathogenesis underlying Costello syndrome.", "abstract": "Costello syndrome is a congenital disorder comprising a characteristic face, severe feeding difficulties, skeletal, cardiac and skin abnormalities, intellectual disability and predisposition to malignancies. It is caused by heterozygous germline HRAS mutations mostly affecting Gly(12) or Gly(13), which impair HRAS-GTPase activity and result in increased downstream signal flow independent of incoming signals. Functional analyses of rarer HRAS mutations identified in individuals with attenuated Costello syndrome phenotypes revealed altered GDP/GTP nucleotide affinities (p.K117R) and inefficient effector binding (p.E37dup). Thus, both phenotypic and functional variability associated with HRAS mutations are evident. Here, we report on a novel heterozygous HRAS germline mutation (c.187_207dup, p.E63_D69dup) in a girl presenting with a phenotype at the milder end of the Costello syndrome spectrum. The p.E63_D69dup mutation impaired co-precipitation of recombinant HRAS with NF1 GTPase-activating protein (GAP) suggesting constitutive HRAS(E63_D69dup) activation due to GAP insensitivity. Indeed, we identified strongly augmented active HRAS(E63_D69dup) that co-precipitated with effectors RAF1, RAL guanine nucleotide dissociation stimulator and phospholipase C1. However, we could not pull down active HRAS(E63_D69dup) using the target protein PIK3CA, indicating a compromised association between active HRAS(E63_D69dup) and PIK3CA. Accordingly, overexpression of HRAS(E63_D69dup) increased steady-state phosphorylation of MEK1/2 and ERK1/2 downstream of RAF, whereas AKT phosphorylation downstream of phosphoinositide 3-kinase (PI3K) was not enhanced. By analyzing signaling dynamics, we found that HRAS(E63_D69dup) has impaired reagibility to stimuli resulting in reduced and disrupted capacity to transduce incoming signals to the RAF-MAPK and PI3K-AKT cascade, respectively. We suggest that disrupted HRAS reagibility, as we demonstrate for the p.E63_D69dup mutation, is a previously unappreciated molecular pathomechanism underlying Costello syndrome.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article", "Case Reports"], "relationships": [{"type": "text_similarity", "rank": 8, "why": "Cosine 0.96 between this abstract and the claim statement.", "passage": "Functional analyses of rarer HRAS mutations identified in individuals with attenuated Costello syndrome phenotypes revealed altered GDP/GTP nucleotide affinities (p.K117R) and inefficient effector binding (p.E37dup).", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}, {"pmid": "23429430", "year": 2013, "date": "2013-02-21", "title": "Assessing genotype-phenotype correlation in Costello syndrome using a severity score.", "abstract": "PurposeCostello syndrome, a rare genetic disorder with multisystemic involvement, is caused by germline HRAS mutations. Because several different missense mutations have been reported, a severity scoring system was developed to assess a possible genotype-phenotype correlation.MethodsRecords of 78 individuals with Costello syndrome were scored in early childhood, childhood, and young adulthood by a reviewer blinded to the individuals' specific mutations. These scores were based on certain medically relevant feeding, neurologic, orthopedic, endocrine, cardiac, malignancy, and mortality manifestations. Individuals' severity scores were then grouped by the particular HRAS mutation. The mixed-model approach for repeated-measures analysis of variance with unstructured within-subject correlation, pairwise comparisons, and contrast were used to determine whether the severity scores differed by mutation.ResultsAlthough the sample size was small, individuals with the p.G12A or p.G12C HRAS change were more severely affected than those with other HRAS mutations. Regardless of the mutation, severity did not increase significantly over time.ConclusionDespite its limitations, including the small number of individuals with rare mutations and possibly incomplete medical records, this work providing the first quantitative assessment of phenotypic severity in a Costello syndrome cohort supports a medically relevant genotype-phenotype correlation.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article"], "relationships": [{"type": "text_similarity", "rank": 10, "why": "Cosine 0.95 between this abstract and the claim statement.", "passage": "PurposeCostello syndrome, a rare genetic disorder with multisystemic involvement, is caused by germline HRAS mutations.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}, {"pmid": "23751039", "year": 2013, "date": "2013-06-01", "title": "Craniofacial and dental malformations in Costello syndrome: A detailed evaluation using multi-detector row computed tomography.", "abstract": "Costello syndrome is a rare multiple congenital anomaly syndrome caused by heterozygous germline HRAS mutations, which is characterized by intellectual disability, growth retardation, distinctive facies, loose skin, cardiomyopathy and a preposition to malignancies. Although teeth abnormalities have been encountered in nearly two-thirds of the patients in literature, the evaluation tended to be limited to the extent which can be obtained from physical examination. We investigated detailed craniofacial, oral and dental findings in four patients with Costello syndrome. In this study, images reconstructed by multi-detector row computed tomography (MDCT) were used as substitutes for dental cast study and panoramic and lateral cephalometric radiograph studies to evaluate dental arches, tooth size, relationships between craniofacial and dental structures, and hypodontia. All four patients showed true/relative macrocephaly with facial bone hypoplasia and gingival hypertrophy. Occlusal attrition, malocclusion, small dental arches, microdontia, and convex face were noted in three patients. In addition, one patient showed dental caries, conic tooth and gingivitis, and another patient showed hypodontia. Our study suggests that craniofacial and dental abnormalities are common in Costello syndrome patients and comprehensive dental care should be provided from early infancy. To our knowledge, this is the first study of thorough craniofacial and dental evaluation by using MDCT in Costello syndrome. MDCT is a useful tool for precise evaluation of craniofacial and oral manifestations in patients with congenital anomaly/intellectual disability syndromes.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article", "Case Reports"], "relationships": [{"type": "text_similarity", "rank": 15, "why": "Cosine 0.94 between this abstract and the claim statement.", "passage": "Costello syndrome is a rare multiple congenital anomaly syndrome caused by heterozygous germline HRAS mutations, which is characterized by intellectual disability, growth retardation, distinctive facies, loose skin, cardiomyopathy and a preposition to malignancies.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}, {"pmid": "23813656", "year": 2013, "date": "2013-06-27", "title": "Orthopedic manifestations and implications for individuals with Costello syndrome.", "abstract": "Costello syndrome is a rare genetic condition caused by heterozygous alterations in HRAS and characterized by multi-system abnormalities. Individuals with Costello syndrome usually present with severe feeding difficulties in infancy, short stature, coarse facial features, increased tumor risks, cardiac and neurological complications, intellectual disability and orthopedic complications. This study further defines the orthopedic manifestations affecting individuals with Costello syndrome. We studied 43 participants and performed medical records review, clinical examinations and orthopedic inquiry forms. In 23 participants, hip and or spinal imaging assessments were completed. Serial radiographs were analyzed when available. A total of 25 orthopedic manifestations were identified. Ten manifestations were seen in the majority of the participants: hypotonia (87%), ligamentous laxity (85%), scoliosis (63%), kyphosis (58%), characteristic hand deformities (85%), ulnar deviation of the wrist (63%), elbow (55%) and shoulder contractures (65%), tight Achilles tendon (73%), and pes planus (53%). Other characteristics of special note were hip dysplasia (45%), foot deformities requiring surgical intervention (38%) and osteopenia/osteoporosis (47%). We also studied the development of the hips and spine. Uni- or bilateral hip dysplasia was congenital in some, while it developed throughout childhood in others. Spinal involvement included scoliosis, kyphosis, lordosis, and curvature reversal (thoracic lordosis and lumbar kyphosis). Based on these findings, we recommend routine referral to an orthopedic surgeon as well as instituting screening protocols for hips and spine for individuals with Costello syndrome.", "pub_types": ["Journal Article"], "relationships": [{"type": "text_similarity", "rank": 11, "why": "Cosine 0.94 between this abstract and the claim statement.", "passage": "Costello syndrome is a rare genetic condition caused by heterozygous alterations in HRAS and characterized by multi-system abnormalities.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}, {"pmid": "24224811", "year": 2013, "date": "2013-11-13", "title": "Kinetic mechanisms of mutation-dependent Harvey Ras activation and their relevance for the development of Costello syndrome.", "abstract": "Costello syndrome is linked to activating mutations of a residue in the p-loop or the NKCD/SAK motifs of Harvey Ras (HRas). More than 10 HRas mutants that induce Costello syndrome have been identified; G12S HRas is the most prevalent of these. However, certain HRas p-loop mutations also are linked to cancer formation that are exemplified with G12V HRas. Despite these relations, specific links between types of HRas mutations and diseases evade definition because some Costello syndrome HRas p-loop mutations, such as G12S HRas, also often cause cancer. This study established novel kinetic parameter-based equations that estimate the value of the cellular fractions of the GTP-bound active form of HRas mutant proteins. Such calculations differentiate between two basic kinetic mechanisms that populate the GTP-bound form of Ras in cells. (i) The increase in the level of GTP-bound Ras is caused by the HRas mutation-mediated perturbation of the intrinsic kinetic characteristics of Ras. This generates a broad spectrum of the population of the GTP-bound form of HRas that typically causes Costello syndrome. The upper end of this spectrum of HRas mutants, as exemplified by G12S HRas, can also cause cancer. (ii) The increase in the level of GTP-bound Ras occurs because the HRas mutations perturb the action of p120GAP on Ras. This causes production of a significantly high population of the only GTP-bound form of HRas linked merely to cancer formation. HRas mutant G12V belongs to this category.", "pub_types": ["research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "citation", "rank": 14, "why": "Cites PMID 16372351. Matched terms: HRAS, Costello.", "passage": "Costello syndrome is linked to activating mutations of a residue in the p-loop or the NKCD/SAK motifs of Harvey Ras (HRas).", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "24259709", "year": 2013, "date": "2013-11-20", "title": "Contributions of intrinsic mutation rate and selfish selection to levels of de novo HRAS mutations in the paternal germline.", "abstract": "The RAS proto-oncogene Harvey rat sarcoma viral oncogene homolog (HRAS) encodes a small GTPase that transduces signals from cell surface receptors to intracellular effectors to control cellular behavior. Although somatic HRAS mutations have been described in many cancers, germline mutations cause Costello syndrome (CS), a congenital disorder associated with predisposition to malignancy. Based on the epidemiology of CS and the occurrence of HRAS mutations in spermatocytic seminoma, we proposed that activating HRAS mutations become enriched in sperm through a process akin to tumorigenesis, termed selfish spermatogonial selection. To test this hypothesis, we quantified the levels, in blood and sperm samples, of HRAS mutations at the p.G12 codon and compared the results to changes at the p.A11 codon, at which activating mutations do not occur. The data strongly support the role of selection in determining HRAS mutation levels in sperm, and hence the occurrence of CS, but we also found differences from the mutation pattern in tumorigenesis. First, the relative prevalence of mutations in sperm correlates weakly with their in vitro activating properties and occurrence in cancers. Second, specific tandem base substitutions (predominantly GC>TT/AA) occur in sperm but not in cancers; genomewide analysis showed that this same mutation is also overrepresented in constitutional pathogenic and polymorphic variants, suggesting a heightened vulnerability to these mutations in the germline. We developed a statistical model to show how both intrinsic mutation rate and selfish selection contribute to the mutational burden borne by the paternal germline.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article"], "relationships": [{"type": "text_similarity", "rank": 17, "why": "Cosine 0.93 between this abstract and the claim statement.", "passage": "Although somatic HRAS mutations have been described in many cancers, germline mutations cause Costello syndrome (CS), a congenital disorder associated with predisposition to malignancy.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}, {"pmid": "23933734", "year": 2014, "date": "2013-08-09", "title": "Depletion of extracellular signal-regulated kinase 1 in mice with cardiomyopathy caused by lamin A/C gene mutation partially prevents pathology before isoenzyme activation.", "abstract": "Mutations in the lamin A/C gene (LMNA) encoding A-type nuclear lamins cause dilated cardiomyopathy with variable muscular dystrophy. These mutations enhance mitogen-activated protein kinase signaling in the heart and pharmacological inhibition of extracellular signal-regulated kinase (ERK) 1 and 2 improves cardiac function in Lmna(H222P/H222P) mice. In the current study, we crossed mice lacking ERK1 to Lmna(H222P/H222P) mice and examined cardiac performance and survival. Male Lmna(H222P/H222P)/Erk1(-/-) mice lacking ERK1 had smaller left ventricular end systolic diameters and increased fractional shortening (FS) at 16 weeks of age than Lmna(H222P/H222P/)Erk1(+/+) mice. Their mean survival was also significantly longer. However, the improved cardiac function was abrogated at 20 weeks of age concurrent with an increased activity of ERK2. Lmna(H222P/H222P)/Erk1(-/-) mice treated with an inhibitor of ERK1/2 activation had smaller left ventricular diameters and increased FS at 20 weeks of age. These results provide genetic evidence that ERK1 and ERK2 contribute to the development of cardiomyopathy caused by LMNA mutations and reveal interplay between these isoenzymes in maintaining a combined pathological activity in heart.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "citation", "rank": 15, "why": "Cites PMID 16372351. The abstract does not state the claim's setting or focus terms.", "passage": "Mutations in the lamin A/C gene (LMNA) encoding A-type nuclear lamins cause dilated cardiomyopathy with variable muscular dystrophy.", "matched_terms": []}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "24057668", "year": 2014, "date": "2013-09-20", "title": "Abnormal Ras signaling in Costello syndrome (CS) negatively regulates enamel formation.", "abstract": "RASopathies are syndromes caused by gain-of-function mutations in the Ras signaling pathway. One of these conditions, Costello syndrome (CS), is typically caused by an activating de novo germline mutation in HRAS and is characterized by a wide range of cardiac, musculoskeletal, dermatological and developmental abnormalities. We report that a majority of individuals with CS have hypo-mineralization of enamel, the outer covering of teeth, and that similar defects are present in a CS mouse model. Comprehensive analysis of the mouse model revealed that ameloblasts, the cells that generate enamel, lacked polarity, and the ameloblast progenitor cells were hyperproliferative. Ras signals through two main effector cascades, the mitogen-activated protein kinase (MAPK) and phosphatidylinositol-3-kinase (PI3K) pathways. To determine through which pathway Ras affects enamel formation, inhibitors targeting either PI3K or MEK 1 and 2 (MEK 1/2), kinases in the MAPK pathway, were utilized. MEK1/2 inhibition rescued the hypo-mineralized enamel, normalized the ameloblast polarity defect and restored normal progenitor cell proliferation. In contrast, PI3K inhibition only corrected the progenitor cell proliferation phenotype. We demonstrate for the first time the central role of Ras signaling in enamel formation in CS individuals and present the mouse incisor as a model system to dissect the roles of the Ras effector pathways in vivo.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "citation", "rank": 16, "why": "Cites PMID 16372351. Matched terms: HRAS, Costello.", "passage": "One of these conditions, Costello syndrome (CS), is typically caused by an activating de novo germline mutation in HRAS and is characterized by a wide range of cardiac, musculoskeletal, dermatological and developmental abnormalities.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "24382691", "year": 2014, "date": "2013-12-30", "title": "Anaplastic rhabdomyosarcoma in TP53 germline mutation carriers.", "abstract": "BackgroundRhabdomyosarcoma (RMS) represents a diverse category of myogenic malignancies with marked differences in molecular alterations and histology. This study examines the question if RMS predisposition due to germline TP53 mutations correlates with certain RMS histologies.MethodsThe histology of RMS tumors diagnosed in 8 consecutive children with TP53 germline mutations was reviewed retrospectively. In addition, germline TP53 mutation analysis was performed in 7 children with anaplastic RMS (anRMS) and previously unknown TP53 status.ResultsRMS tumors diagnosed in 11 TP53 germline mutation carriers all exhibited nonalveolar, anaplastic histology as evidenced by the presence of enlarged hyperchromatic nuclei with or without atypical mitotic figures. Anaplastic RMS was the first malignant diagnosis for all TP53 germline mutation carriers in this cohort, and median age at diagnosis was 40 months (mean, 40 months ± 15 months; range, 19-67 months). The overall frequency of TP53 germline mutations was 73% (11 of 15 children) in pediatric patients with anRMS. The frequency of TP53 germline mutations in children with anRMS was 100% (5 of 5 children) for those with a family cancer history consistent with Li-Fraumeni syndrome (LFS), and 80% (4 of 5 children) for those without an LFS cancer phenotype.ConclusionsIndividuals harboring germline TP53 mutations are predisposed to develop anRMS at a young age. If future studies in larger anRMS cohorts confirm the findings of this study, the current Chompret criteria for LFS should be extended to include children with anRMS irrespective of family history.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article"], "relationships": [{"type": "citation", "rank": 17, "why": "Cites PMID 16372351. The abstract does not state the claim's setting or focus terms.", "passage": "BackgroundRhabdomyosarcoma (RMS) represents a diverse category of myogenic malignancies with marked differences in molecular alterations and histology.", "matched_terms": []}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "24464785", "year": 2014, "date": "2014-01-24", "title": "Targeted deletion of RasGRP1 impairs skin tumorigenesis.", "abstract": "Ras is frequently activated in cutaneous squamous cell carcinoma, a prevalent form of skin cancer. However, the pathways that contribute to Ras-induced transformation have not been entirely elucidated. We have previously demonstrated that in transgenic mice, overexpression of the Ras activator RasGRP1 promotes the formation of spontaneous skin tumors and enhances malignant progression in the multistage carcinogenesis skin model that relies on the oncogenic activation of H-Ras. Utilizing a RasGRP1 knockout mouse model (RasGRP1 KO), we now show that lack of RasGRP1 reduced the susceptibility to skin tumorigenesis. The dependency on RasGRP1 was associated with a diminished response to the phorbol ester tumor promoter 12-O-tetradecanoylphorbol-13-acetate (TPA). Specifically, we found impairment of epidermal hyperplasia induced by TPA through keratinocyte proliferation. Using a keratinocyte cell line that carries a ras oncogenic mutation, we also demonstrated that RasGRP1 could further activate Ras in response to TPA. Thus, we propose that RasGRP1 upregulates signaling from Ras and contributes to epidermal tumorigenesis by increasing the total dosage of active Ras.", "pub_types": ["research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "shared_references", "rank": 2, "why": "Cites source references: 1697691.", "passage": "Ras is frequently activated in cutaneous squamous cell carcinoma, a prevalent form of skin cancer.", "matched_terms": []}], "in_packet": false, "in_budget": ["combination"]}, {"pmid": "24668879", "year": 2014, "date": "2014-03-25", "title": "Craniofacial and dental development in Costello syndrome.", "abstract": "Costello syndrome (CS) is a RASopathy characterized by a wide range of cardiac, musculoskeletal, dermatological, and developmental abnormalities. The RASopathies are defined as a group of syndromes caused by activated Ras/mitogen-activated protein kinase (MAPK) signaling. Specifically, CS is caused by activating mutations in HRAS. Although receptor tyrosine kinase (RTK) signaling, which is upstream of Ras/MAPK, is known to play a critical role in craniofacial and dental development, the craniofacial and dental features of CS have not been systematically defined in a large group of individuals. In order to address this gap in our understanding and fully characterize the CS phenotype, we evaluated the craniofacial and dental phenotype in a large cohort (n = 41) of CS individuals. We confirmed that the craniofacial features common in CS include macrocephaly, bitemporal narrowing, convex facial profile, full cheeks, and large mouth. Additionally, CS patients have a characteristic dental phenotype that includes malocclusion with anterior open bite and posterior crossbite, enamel hypo-mineralization, delayed tooth development and eruption, gingival hyperplasia, thickening of the alveolar ridge, and high palate. Comparison of the craniofacial and dental phenotype in CS with other RASopathies, such as cardio-facio-cutaneous syndrome (CFC), provides insight into the complexities of Ras/MAPK signaling in human craniofacial and dental development.", "pub_types": ["research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "citation", "rank": 18, "why": "Cites PMID 16372351. Matched terms: HRAS, Costello.", "passage": "Costello syndrome (CS) is a RASopathy characterized by a wide range of cardiac, musculoskeletal, dermatological, and developmental abnormalities.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "25133308", "year": 2014, "date": "2014-08-18", "title": "Early-lethal Costello syndrome due to rare HRAS Tandem Base substitution (c.35_36GC>AA; p.G12E)-associated pulmonary vascular disease.", "abstract": "Costello syndrome is a rare, autosomal-dominant syndrome caused by activating missense mutations in the Harvey rat sarcoma viral oncogene homolog (HRAS), most often p.G12S. Several rare mutations have consistently been associated with a more severe phenotype that is often lethal in infancy. Cause of death is most often respiratory failure, with hypertrophic cardiomyopathy playing a significant role in morbidity. Impaired fibroblast elastogenesis is thought to contribute to the Costello phenotype, but reports of histologic evidence of disordered elastogenesis at autopsy are limited. We report a patient with Costello syndrome due to a rare tandem base substitution (c.35_36GC>AA) resulting in the p.G12E missense change. The proband died at the age of 3 months from respiratory failure, with minimal evidence of cardiomyopathy. The autopsy disclosed pulmonary vascular dysplasia affecting small arteries and veins associated with abnormal elastin distribution in tortuous dilated arteries and veins, with nonuniform wall thickness and semiobstructive lesions at artery branch points typical of early pulmonary hypertensive vascular disease. Elastic fibers in the dermis were abnormally short and fragmented. This case suggests that disordered elastogenesis in the pulmonary vasculature and undiagnosed (or underdiagnosed) pulmonary hypertension may contribute to morbidity in patients with Costello syndrome.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Case Reports", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "text_similarity", "rank": 9, "why": "Cosine 0.95 between this abstract and the claim statement.", "passage": "Costello syndrome is a rare, autosomal-dominant syndrome caused by activating missense mutations in the Harvey rat sarcoma viral oncogene homolog (HRAS), most often p.G12S.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}, {"pmid": "25387514", "year": 2014, "date": "2014-11-01", "title": "Syndrome in question. Costello syndrome.", "abstract": "Costello syndrome (CS) is a rare genetic disorder, first described by Costello in 1971, caused by mutations in the HRAS proto-oncogene. Clinical findings include facial dysmorphism, skin disorders, cognitive impairment, cardiac and musculoskeletal defects. There is an increased risk of malignancies in these patients, due to the proto-oncogene mutation, and also sudden death secondary to heart disease. We report a case with characteristic phenotype, highlighting the peculiar skin changes.", "pub_types": ["Journal Article", "Case Reports", "case-report"], "relationships": [{"type": "text_similarity", "rank": 12, "why": "Cosine 0.94 between this abstract and the claim statement.", "passage": "Costello syndrome (CS) is a rare genetic disorder, first described by Costello in 1971, caused by mutations in the HRAS proto-oncogene.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}], "reviews": [{"pmid": "25506974", "year": 2010, "date": "2014-09-18", "title": "An in Vivo Active Carbamate-based Dual Inhibitor of Lysophospholipase 1 (LYPLA1) and Lysophospholipase 2 (LYPLA2)", "abstract": "Protein palmitoylation is an essential post-translational modification necessary for trafficking and localization of regulatory proteins that play key roles in cell growth and signaling. Multiple oncogenes, including HRAS and SRC, require palmitoylation for malignant transformation. Lysophospholipase 1 (LYPLA1) has been identified as a candidate protein palmitoyl thioesterase responsible for HRAS depalmitoylation in mammalian cells. Seeking chemical tools to investigate LYPLA biochemical pathway involvement and potential roles in cancer pathogenesis, we conducted a fluorescence polarization-based competitive activity-based protein profiling (fluopol-ABPP) HTS campaign to identify inhibitors of LYPLA1 and the structurally related LYPLA2. HTS identified a lead triazole urea micromolar inhibitor, which we optimized as dual LYPLA1/LYPLA2 inhibitor ML211, and reversible compounds ML348 and ML349 that act as selective LYPLA1 and LYPLA2 inhibitors, respectively. These compounds represented an important advance in chemical tools for investigating the biological function(s) of LYPLA1 and LYPLA2. However, ML211, owing to its modest solubility, does not have demonstrated in vivo activity. With the goal of developing an irreversible, in vivo-active dual LYPLA1/LYPLA2 inhibitor, we investigated SAR around a carbamate scaffold, from which we optimized ML378, a dual LYPLA1/LYPLA2 inhibitor with nM potency and demonstrated peripheral in vivo activity.", "pub_types": ["Review"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Protein palmitoylation is an essential post-translational modification necessary for trafficking and localization of regulatory proteins that play key roles in cell growth and signaling.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "25473706", "year": 2011, "date": "2011-07-06", "title": "Health Risk Appraisal", "abstract": "This technology assessment on health risk appraisals (HRAs) was prepared by the McMaster University Evidence-based Practice Center (MU-EPC) for the Centers for Medicare and Medicaid Services (CMS). The primary goals of the assessment were to describe key features of HRAs, examine which features were associated with successful HRAs, and discuss the applicability of HRAs to the Medicare population.", "pub_types": ["Review"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "This technology assessment on health risk appraisals (HRAs) was prepared by the McMaster University Evidence-based Practice Center (MU-EPC) for the Centers for Medicare and Medicaid Services (CMS).", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "24624465", "year": 2010, "date": "2014-01-13", "title": "Characterization of a Selective, Reversible Inhibitor of Lysophospholipase 1 (LYPLA1)", "abstract": "Protein palmitoylation is an essential post-translational modification necessary for trafficking and localization of regulatory proteins that play key roles in cell growth and signaling. Multiple oncogenes, including HRAS and SRC, require palmitoylation for malignant transformation. Lysophospholipase 1 (LYPLA1) has been identified as a candidate protein palmitoyl thioesterase responsible for HRAS depalmitoylation in mammalian cells. Seeking chemical tools to investigate biochemical pathway involvement and potential roles in cancer pathogenesis, we conducted a fluorescence polarization-based competitive activity-based protein profiling (fluopol-ABPP) HTS campaign to identify inhibitors of LYPLA1 and the structurally related LYPLA2. HTS identified a lead triazole urea micromolar inhibitor, which we optimized as dual LYPLA1/LYPLA2 inhibitor ML211, and reversible compounds ML348 and ML349 that act as selective LYPLA1 and LYPLA2 inhibitors, respectively. Using an advanced competitive ABPP strategy employing ABPP probes with controlled reactivity rates, we successfully confirmed potent and selective target engagement of these reversible compounds in living systems as detailed here for ML348 and in the accompanying ML349 Probe Report. Together, these compounds should greatly aid investigations into the biological function of LYPLA1 and LYPLA2.", "pub_types": ["Review"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Protein palmitoylation is an essential post-translational modification necessary for trafficking and localization of regulatory proteins that play key roles in cell growth and signaling.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "24624468", "year": 2010, "date": "2014-09-18", "title": "Characterization of a Selective, Reversible Inhibitor of Lysophospholipase 2 (LYPLA2)", "abstract": "Protein palmitoylation is an essential post-translational modification necessary for trafficking and localization of regulatory proteins that play key roles in cell growth and signaling. Multiple oncogenes, including HRAS and SRC, require palmitoylation for malignant transformation. Lysophospholipase 1 (LYPLA1) has been identified as a candidate protein palmitoyl thioesterase responsible for HRAS depalmitoylation in mammalian cells. LYPLA1 has a close homolog, LYPLA2 (65% sequence identity), whose substrate specificity and biochemical roles are, as yet, uncharacterized. Seeking chemical tools to investigate biochemical pathway involvement and potential roles in cancer pathogenesis of these enzymes, we conducted a fluorescence polarization-based competitive activity-based protein profiling (fluopol-ABPP) HTS campaign to identify inhibitors of LYPLA1 and LYPLA2. HTS identified a lead triazole urea micromolar inhibitor, which we optimized as dual LYPLA1/LYPLA2 inhibitor ML211, and reversible compounds ML348 and ML349 that act as selective LYPLA1 and LYPLA2 inhibitors, respectively. Using an advanced competitive ABPP strategy employing ABPP probes with controlled reactivity rates, we successfully confirmed potent and selective target engagement of these reversible compounds in living systems as detailed here for ML349 and in the accompanying ML348 Probe Report. Together, these compounds should greatly aid investigations into the biological function of LYPLA1 and LYPLA2.", "pub_types": ["Review"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Protein palmitoylation is an essential post-translational modification necessary for trafficking and localization of regulatory proteins that play key roles in cell growth and signaling.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "23658947", "year": 2010, "date": "2013-03-07", "title": "Optimization and characterization of a triazole urea dual inhibitor for lysophospholipase 1 (LYPLA1) and lysophospholipase 2 (LYPLA2)", "abstract": "Protein palmitoylation is an essential post-translational modification necessary for trafficking and localization of regulatory proteins that play key roles in cell growth and signaling. Multiple oncogenes, including HRAS and SRC, require palmitoylation for malignant transformation. We [1] and others [2] have previously identified lysophospholipase 1 (LYPLA1) as a candidate protein palmitoyl thioesterase responsible for HRAS depalmitoylation in mammalian cells. Seeking chemical tools to investigate biochemical pathway involvement and potential roles in cancer pathogenesis, we conducted a fluorescence polarization-based competitive activity-based protein profiling (FluoPol ABPP) [3] high throughput screening (HTS) campaign to identify inhibitors of LYPLA1 and the structurally related LYPLA2. HTS identified a micromolar triazole urea inhibitor, which we successfully optimized via several rounds of structure activity relationship (SAR)-by-synthesis to produce ML211 (SID 99445338), a low nanomolar dual inhibitor of LYPLA1 and LYPLA2. The reported probe operates by a covalent mechanism of action and is active both in vitro and in situ. Out of more than 20 serine hydrolases (SHs) profiled by gel-based competitive ABPP, ML211 is observed to have one anti-target, alpha/beta hydrolase domain-containing protein 11 (ABHD11). However, during our SAR campaign, we fortuitously discovered a selective ABHD11 inhibitor from among the synthetic triazole urea library compounds. This compound, ML226, is presented as an anti-probe for control studies.", "pub_types": ["Review"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Protein palmitoylation is an essential post-translational modification necessary for trafficking and localization of regulatory proteins that play key roles in cell growth and signaling.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "23658953", "year": 2010, "date": "2013-03-07", "title": "Optimization and characterization of a triazole urea inhibitor for alpha/beta hydrolase domain-containing protein 11 (ABHD11): anti-probe for LYPLA1/LYPLA2 dual inhibitor ML211", "abstract": "Protein palmitoylation is an essential post-translational modification necessary for trafficking and localization of regulatory proteins that play key roles in cell growth and signaling. Multiple oncogenes, including HRAS and SRC, require palmitoylation for malignant transformation. We [1] and others [2] have previously identified lysophospholipase 1 (LYPLA1) as a candidate protein palmitoyl thioesterase responsible for HRAS depalmitoylation in mammalian cells. Seeking chemical tools to investigate biochemical pathway involvement and potential roles in cancer pathogenesis, we conducted a fluorescence polarization-based competitive activity-based protein profiling (FluoPol ABPP) [3] high throughput screening (HTS) campaign to identify inhibitors of LYPLA1 and the structurally related LYPLA2. HTS identified a micromolar triazole urea inhibitor, that we successfully optimized via several rounds of SAR-by-synthesis as ML211 (SID 99445338), a low nanomolar dual inhibitor of LYPLA1 and LYPLA2. The reported probe operates by a covalent mechanism of action and is active both in vitro and in situ. Out of more than 20 serine hydrolases (SHs) profiled by gel-based competitive activity-based protein profiling (ABPP), ML211 was observed to have one anti-target, alpha/beta hydrolase domain-containing protein 11 (ABHD11). Fortuitously, one of the triazole urea library members synthesized during the course of probe optimization was found to be a potent and selective inhibitor of ABHD11, a poorly characterized SH that is hemizygously deleted in Williams-Beuren syndrome [4], and was presented as a control anti-probe (SID 99445332) in the ML211 Probe Report. The optimized ABHD11 probe ML226 is a potent inhibitor of ABHD11, with an IC50 of 15 nM, and exhibits at least 100-fold selectivity for all other SHs (~20) assessed by gel-based competitive ABPP. The probe is also active in situ, completely and selectively inhibiting ABHD11 at sub-nanomolar concentrations. As with ML211, the probe operates by a covalent mechanism of action, carbamoylating the active site serine of ABHD11. The complete properties, characterization, and synthesis of ML226 are detailed in this Probe Report.", "pub_types": ["Review"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Protein palmitoylation is an essential post-translational modification necessary for trafficking and localization of regulatory proteins that play key roles in cell growth and signaling.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "23762940", "year": 2010, "date": "2013-03-07", "title": "ML264: An Antitumor Agent that Potently and Selectively Inhibits Krüppel-like Factor Five (KLF5) Expression: A Probe for Studying Colon Cancer Development and Progression", "abstract": "Krüppel-like factor 5 (KLF5) is a zinc finger-containing transcription factor that is highly expressed in rapidly dividing intestinal epithelial cells. KLF5 binds to GC-rich sequences in promoters of numerous genes, including cyclin D1, cyclin B1/Cdc2, and integrin-linked kinase. KLF5 mediates the transforming effects of oncogenic H-Ras, and as a result it is thought to be important in regulating colon cancer pathogenesis, thus KLF5 inhibitors are of interest in cancer chemotherapy. We used an ultra-high throughput screening (uHTS) strategy to identify and confirm KLF5-specific activity and potency of Molecular Libraries Small Molecule Repository (MLSMR) compounds, also using a cytotoxicity counterscreen with KLF5-deficient IEC-6 colon cell line to eliminate false positives. The SRIMSC performed the KLF5 and IEC-6 assays in dose response format, validating selected HTS hits for re-purchase and for follow-up studies. We initiated both structure activity relationship (SAR)-by-purchase and in-house synthesis campaigns. The assay provider evaluated hits and their analogs to determine potency, selectivity, and mechanism of action, establishing the necessary assays for proper evaluation (e.g., western blotting, cytotox evaluation, and cell cycle studies; all data were submitted to PubChem). The team ultimately chose to focus efforts on a lead series which provided a compound fully meeting the probe criteria for KLF5 inhibition: ML264, also designated CID 51003603, SID 117686865, and SR-03000002171. ML264 is highly active (IC50 = 29 nM is a cell-based assay for proliferation of DLD-1 cells, IC50 = 81 nM in a cell-based luciferase assay). It lacks cytotoxicity in the IEC-6 control cell line (IC50 >50 μM, \u003c50% inhibition was observed at 100 μM). Robust activity was also seen in several other KLF5-expressing cell types as well (e.g., HCT116, IC50 = 560 nM; HT29, IC50 = 130 nM; SW620, IC50 = 430 nM). ML264 does not inhibit kinases associated with the KLF5 pathway, as determined using a panel of 47 selected kinases. Western blot analysis shows that ML264 significantly reduces KLF5 expression. These results demonstrate KLF5 target specificity. An NCI60 panel study using ML264 revealed that it induces death of most colon cancer cell lines, with cytotoxicity toward several other tumor cell lines as well. ML264 is chemically stable, unreactive with glutathione, has suitable aqueous solubility, is highly stable to mouse, rat, and human hepatic microsomes, has favorable properties associated with drug-likeness, and does not inhibit CYP enzymes. Due to these properties in concert with its high cellular potency and selectivity, ML264 is a good candidate for in vivo anticancer studies, with great potential for use in long time-course in situ studies aimed to elucidate the role of KLF5 as a regulator of cellular proliferation and tumor formation in the intestinal epithelium.", "pub_types": ["Review"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Krüppel-like factor 5 (KLF5) is a zinc finger-containing transcription factor that is highly expressed in rapidly dividing intestinal epithelial cells.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "17323586", "year": 2006, "date": "2006-01-01", "title": "Olmesartan medoxomil: current status of its use in monotherapy.", "abstract": "Olmesartan medoxomil is an angiotensin II receptor antagonist. In pooled analyses of seven randomized, double-blind trials, 8 weeks' treatment with olmesartan medoxomil was significantly more effective than placebo in terms of the response rate, proportion of patients achieving target blood pressure (BP) and mean change from baseline in diastolic (DBP) and systolic blood pressure (SBP). Olmesartan medoxomil had a fast onset of action, with significant between-group differences evident from 2 weeks onwards. The drug was well tolerated with a similar adverse event profile to placebo. In patients with type 2 diabetes, olmesartan medoxomil reduced renal vascular resistance, increased renal perfusion, and reduced oxidative stress. In several large, randomized, double-blind trials, olmesartan medoxomil 20 mg has been shown to be significantly more effective, in terms of primary endpoints, than recommended doses of losartan, valsartan, irbesartan, or candesartan cilexetil, and to provide better 24 h BP protection. Olmesartan medoxomil was at least as effective as amlodipine, felodipine and atenolol, and significantly more effective than captopril. The efficacy of olmesartan medoxomil in reducing cardiovascular risk beyond BP reduction is currently being investigated in trials involving patients at high risk due to atherosclerosis or type 2 diabetes.", "pub_types": ["review-article", "Review", "Journal Article"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Olmesartan medoxomil is an angiotensin II receptor antagonist.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "17137931", "year": 2006, "date": "2006-01-01", "title": "Plasticity and second messengers during synapse development.", "abstract": "", "pub_types": ["research-article", "Review", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Plasticity and second messengers during synapse development.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "16935882", "year": 2006, "date": "2006-08-25", "title": "DExD/H box RNA helicases: multifunctional proteins with important roles in transcriptional regulation.", "abstract": "The DExD/H box family of proteins includes a large number of proteins that play important roles in RNA metabolism. Members of this family have been shown to act as RNA helicases or unwindases, using the energy from ATP hydrolysis to unwind RNA structures or dissociate RNA-protein complexes in cellular processes that require modulation of RNA structures. However, it is clear that several members of this family are multifunctional and, in addition to acting as RNA helicases in processes such as pre-mRNA processing, play important roles in transcriptional regulation. In this review I shall concentrate on RNA helicase A (Dhx9), DP103 (Ddx20), p68 (Ddx5) and p72 (Ddx17), proteins for which there is a strong body of evidence showing that they play important roles in transcription, often as coactivators or corepressors through their interaction with key components of the transcriptional machinery, such as CREB-binding protein, p300, RNA polymerase II and histone deacetylases.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Review", "Journal Article"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "The DExD/H box family of proteins includes a large number of proteins that play important roles in RNA metabolism.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "16834766", "year": 2006, "date": "2006-07-03", "title": "Breast cancer, stem cells and prospects for therapy.", "abstract": "The mammary epithelium contains multipotent stem cells that give rise to all differentiated cell types present within the tissue. Mammary epithelial stem cells have been prospectively purified from dissociated mammary epithelium on the basis of cell surface antigen expression. It has become apparent in recent years that for breast cancer and other malignancies only a small proportion of tumour cells--'cancer stem cells'--have the capacity for extensive proliferation and transferral of the tumour. We review the evidence for breast cancer stem cells, we consider their relationship to mammary epithelial stem cells and we examine the implications for current and future therapeutic strategies.", "pub_types": ["review-article", "Review", "Journal Article"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "The mammary epithelium contains multipotent stem cells that give rise to all differentiated cell types present within the tissue.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "16760571", "year": 2006, "date": "2006-01-01", "title": "Development, migration, and survival of mast cells.", "abstract": "Mast cells play a pivotal role in immediate hypersensitivity and chronic allergic reactions that can contribute to asthma, atopic dermatitis, and other allergic diseases. Because mast cell numbers are increased at sites of inflammation in allergic diseases, pharmacologic intervention into the proliferation, migration, and survival (or apoptosis) of mast cells could be a promising strategy for the management of allergic diseases. Mast cells differentiate from multipotent hematopoietic progenitors in the bone marrow. Stem cell factor (SCF) is a major chemotactic factor for mast cells and their progenitors. SCF also elicits cell-cell and cell-substratum adhesion, facilitates the proliferation, and sustains the survival, differentiation, and maturation, of mast cells. Therefore, many aspects of mast cell biology can be understood as interactions of mast cells and their precursors with SCF and factors that modulate their responses to SCF and its signaling pathways. Numerous factors known to have such a capacity include cytokines that are secreted from activated T cells and other immune cells including mast cells themselves. Recent studies also demonstrated that monomeric IgE binding to FcepsilonRI can enhance mast-cell survival. In this review we discuss the factors that regulate mast cell development, migration, and survival.", "pub_types": ["research-article", "Review", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Mast cells play a pivotal role in immediate hypersensitivity and chronic allergic reactions that can contribute to asthma, atopic dermatitis, and other allergic diseases.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "16573347", "year": 2006, "date": "2006-01-01", "title": "The future of antisense oligonucleotides in the treatment of respiratory diseases.", "abstract": "Antisense oligonucleotides (ASO) are short synthetic DNA molecules designed to inhibit translation of a targeted gene to protein via interaction with messenger RNA. More recently, small interfering (si)RNA have been developed as potent tools to specifically inhibit gene expression. ASO directed against signaling molecules, cytokine receptors, and transcription factors involved in allergic immune and inflammatory responses, have been applied in experimental models of asthma and demonstrate potential as therapeutics. Several ASO-based drugs directed against oncogenes have been developed for therapy of lung cancer, and some have recently reached clinical trials. ASO and siRNA to respiratory syncytial virus infection have demonstrated good potential to treat this condition, particularly in combination with an antiviral drug. Although ASO-based therapeutics are promising for lung diseases, issues of specificity, identification of correct molecular targets, delivery and carrier systems, as well as potential adverse effects must be carefully evaluated before clinical application.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Review", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Antisense oligonucleotides (ASO) are short synthetic DNA molecules designed to inhibit translation of a targeted gene to protein via interaction with messenger RNA.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "19771215", "year": 2006, "date": "2006-02-28", "title": "RNAi and cancer: Implications and applications.", "abstract": "RNA interference (RNAi) is an endogenous process that regulates expression of genes and corresponding proteins to maintain homeostasis in diverse organisms. Non-coding RNAs (ncRNAs) including both long and short ncRNAs are widely expressed and levels of some specific microRNAs are different in tumor and non-tumor tissues. RNAi has been invaluable for unraveling critical pathways involved in cancer development, growth and metastasis and has identified critical tumor-type specific gene targets for chemotherapy. In addition, the development of new derivatized small inhibitory RNAs and more efficient methods of their delivery will facilitate the future development of these ribonucleotides as cancer chemotherapeutic agents.", "pub_types": ["review-article", "Journal Article"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "RNA interference (RNAi) is an endogenous process that regulates expression of genes and corresponding proteins to maintain homeostasis in diverse organisms.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "17576437", "year": 2006, "date": "2006-02-01", "title": "Natural health products that inhibit angiogenesis: a potential source for investigational new agents to treat cancer-Part 1.", "abstract": "An integrative approach for managing a patient with cancer should target the multiple biochemical and physiologic pathways that support tumour development and minimize normal-tissue toxicity. Angiogenesis is a key process in the promotion of cancer. Many natural health products that inhibit angiogenesis also manifest other anticancer activities. The present article focuses on products that have a high degree of anti-angiogenic activity, but it also describes some of the many other actions of these agents that can inhibit tumour progression and reduce the risk of metastasis. Natural health products target molecular pathways other than angiogenesis, including epidermal growth factor receptor, the HER2/neu gene, the cyclooxygenase-2 enzyme, the nuclear factor kappa-B transcription factor, the protein kinases, the Bcl-2 protein, and coagulation pathways. The herbs that are traditionally used for anticancer treatment and that are anti-angiogenic through multiple interdependent processes (including effects on gene expression, signal processing, and enzyme activities) include Artemisia annua (Chinese wormwood), Viscum album (European mistletoe), Curcuma longa (curcumin), Scutellaria baicalensis (Chinese skullcap), resveratrol and proanthocyanidin (grape seed extract), Magnolia officinalis (Chinese magnolia tree), Camellia sinensis (green tea), Ginkgo biloba, quercetin, Poria cocos, Zingiber officinalis (ginger), Panax ginseng, Rabdosia rubescens hora (Rabdosia), and Chinese destagnation herbs. Quality assurance of appropriate extracts is essential prior to embarking upon clinical trials. More data are required on dose-response, appropriate combinations, and potential toxicities. Given the multiple effects of these agents, their future use for cancer therapy probably lies in synergistic combinations. During active cancer therapy, they should generally be evaluated in combination with chemotherapy and radiation. In this role, they act as modifiers of biologic response or as adaptogens, potentially enhancing the efficacy of the conventional therapies.", "pub_types": ["review-article", "Journal Article"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "An integrative approach for managing a patient with cancer should target the multiple biochemical and physiologic pathways that support tumour development and minimize normal-tissue toxicity.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "16526274", "year": 2006, "date": "2006-02-01", "title": "Differential functions of Ras for malignant phenotypic conversion.", "abstract": "Among the effector molecules connected with the group of cell surface receptors, Ras proteins have essential roles in transducing extracellular signals to diverse intracellular events, by controlling the activities of multiple signaling pathways. For over 20 years since the discovery of Ras proteins, an enormous amount of knowledge has been accumulated as to how the proteins function in overlapping or distinct fashions. The signaling networks they regulate are very complex due to their multiple functions and cross-talks. Much attention has been paid to the pathological role of Ras in tumorigenesis. In particular, human tumors very frequently express Ras proteins constitutively activated by point mutations. Up to date, three members of the Ras family have been identified, namely H-Ras, K-Ras (A and B), and N-Ras. Although these Ras isoforms function in similar ways, many evidences also support the distinct molecular function of each Ras protein. This review summarizes differential functions of Ras and highlights the current view of the distinct signaling network regulated by each Ras for its contribution to the malignant phenotypic conversion of breast epithelial cells. Four issues are addressed in this review: (1) Ras proteins, (2) membrane localization of Ras, (3) effector molecules downstream of Ras, (4) Ras signaling in invasion. In spite of the accumulation of information on the differential functions of Ras, much more remains to be elucidated to understand the Ras-mediated molecular events of malignant phenotypic conversion of cells in a greater detail.", "pub_types": ["Research Support, Non-U.S. Gov't", "Review", "Journal Article"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Among the effector molecules connected with the group of cell surface receptors, Ras proteins have essential roles in transducing extracellular signals to diverse intracellular events, by controlling the activities of multiple signaling pathways.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "16449632", "year": 2006, "date": "2006-02-01", "title": "Surprising dependency for retinoblastoma protein in ras-mediated tumorigenesis.", "abstract": "", "pub_types": ["review-article", "Review", "Journal Article"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Surprising dependency for retinoblastoma protein in ras-mediated tumorigenesis.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "21686117", "year": 2010, "date": "2010-07-01", "title": "Ras history: The saga continues.", "abstract": "Although the roots of Ras sprouted from the rich history of retrovirus research, it was the discovery of mutationally activated RAS genes in human cancer in 1982 that stimulated an intensive research effort to understand Ras protein structure, biochemistry and biology. While the ultimate goal has been developing anti-Ras drugs for cancer treatment, discoveries from Ras have laid the foundation for three broad areas of science. First, they focused studies on the origins of cancer to the molecular level, with the subsequent discovery of genes mutated in cancer that now number in the thousands. Second, elucidation of the biochemical mechanisms by which Ras facilitates signal transduction established many of our fundamental concepts of how a normal cell orchestrates responses to extracellular cues. Third, Ras proteins are also founding members of a large superfamily of small GTPases that regulate all key cellular processes and established the versatile role of small GTP-binding proteins in biology. We highlight some of the key findings of the last 28 years.", "pub_types": ["review-article", "Journal Article"], "relationships": [{"type": "review", "rank": null, "why": "Publication type is a review, editorial, comment, or letter. Repetition here is not an independent experiment.", "passage": "Although the roots of Ras sprouted from the rich history of retrovirus research, it was the discovery of mutationally activated RAS genes in human cancer in 1982 that stimulated an intensive research effort to understand Ras protein structure, biochemistry and biology.", "matched_terms": []}], "in_packet": false, "in_budget": []}, {"pmid": "24129065", "year": 2014, "date": "2013-10-15"
