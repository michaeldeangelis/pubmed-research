<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,640;1,9..144,520&family=Outfit:wght@380;520;640&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3efe6;
    --paper-2: #e7e1d4;
    --ink: #1c1915;
    --muted: #5e584e;
    --rule: #d5cec1;
    --cite: #8d3428;
    --experiment: #1d4a3e;
    --similar: #2c3d6b;
    --gene: #6a5432;
    --shared: #4a3d55;
    --review: #6d675e;
    --packet: #8a5a12;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      linear-gradient(90deg, rgba(28, 25, 21, 0.03) 1px, transparent 1px) 0 0 / 22px 22px,
      var(--paper);
    color: var(--ink);
    font-family: Outfit, "Avenir Next", "Segoe UI", sans-serif;
    font-weight: 380;
  }
  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100%;
  }
  aside {
    border-right: 1px solid var(--rule);
    padding: 22px 16px 40px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: auto;
    background: rgba(243, 239, 230, 0.92);
  }
  .mark {
    font-family: Fraunces, Palatino, Georgia, serif;
    font-weight: 640;
    font-size: 22px;
    letter-spacing: -0.03em;
    margin: 0 0 4px;
  }
  .mark span { color: var(--cite); }
  aside p.note, .banner, .meta, .why, .empty {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
  }
  .claim-btn {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    border-top: 1px solid var(--rule);
    background: transparent;
    color: inherit;
    padding: 10px 4px;
    cursor: pointer;
    font: inherit;
  }
  .claim-btn strong {
    display: block;
    font-weight: 520;
    font-size: 13px;
  }
  .claim-btn em {
    font-style: normal;
    color: var(--muted);
    font-size: 12px;
  }
  .claim-btn.active { background: var(--paper-2); }
  main { padding: 36px 48px 80px; max-width: 920px; }
  .banner {
    border-left: 3px solid var(--cite);
    padding: 0 0 0 12px;
    margin-bottom: 22px;
  }
  .kicker {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }
  h1 {
    font-family: Fraunces, Palatino, Georgia, serif;
    font-weight: 520;
    font-size: 34px;
    line-height: 1.2;
    letter-spacing: -0.03em;
    margin: 0 0 14px;
  }
  .quote {
    font-family: Fraunces, Palatino, Georgia, serif;
    font-style: italic;
    font-size: 20px;
    line-height: 1.4;
    margin: 0 0 18px;
  }
  .spec {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 6px 12px;
    margin: 0 0 22px;
    font-size: 14px;
  }
  .spec dt { color: var(--muted); }
  .spec dd { margin: 0; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 18px; }
  .filters button {
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 10px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .filters button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  article.card {
    border-top: 1px solid var(--rule);
    padding: 16px 0 18px;
  }
  .card-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  .pmid { font-variant-numeric: tabular-nums; font-size: 12px; letter-spacing: 0.04em; color: var(--muted); }
  h2 { font-size: 18px; font-weight: 520; line-height: 1.35; margin: 4px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 999px;
    color: white;
  }
  .chip.citation { background: var(--cite); }
  .chip.experimental { background: var(--experiment); }
  .chip.text_similarity { background: var(--similar); }
  .chip.same_gene { background: var(--gene); }
  .chip.shared_references { background: var(--shared); }
  .chip.review { background: var(--review); }
  .chip.packet { background: var(--packet); }
  .passage {
    margin: 8px 0;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.45);
    border-left: 2px solid var(--ink);
    font-family: Fraunces, Palatino, Georgia, serif;
    font-size: 16px;
    line-height: 1.45;
  }
  .passage mark { background: #ead9a2; color: inherit; }
  details { margin-top: 6px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details p { font-size: 14px; line-height: 1.5; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    aside { position: relative; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); }
    main { padding: 24px 18px 60px; }
  }
</style>
</head>

 reaction, whereas screening of BRAF (exon 15) and RAS (HRAS, KRAS2 and NRAS) mutations were performed, respectively, by single strand conformation polymorphism and denaturing high-pressure liquid chromatography.ResultsRET/PTC expressions was positive in 5/43 (11.6%) PTC and in none of the non-PTC tumour. Similarly, BRAF mutations were positive only in PTC, but with a higher prevalence (24/43 positives, 55.8%). All but one BRAF mutation resulted in the prototypic substitution of valine 600 with a glutamic acid. In one case, a somatic in-frame insertion of three bases at codon 599 resulted in the insertion of an additional valine. RET/PTC expression and BRAF mutations were mutually exclusive. Screening of the RAS gene allowed identification of oncogenic mutations in 1/3 (33.3%) FA and 3/4 (75%) FTC. None of the PTCs was positive for RAS.ConclusionsThese data indicate that BRAF mutations are the most frequent genetic event in PTC and that RAS mutations, besides being a genetic hallmark of follicular tumours, are rare or completely absent in PTC from our area. Together, BRAF mutations and rarer RET rearrangements accounted for a genetic event in two-thirds of PTCs. This study showed a novel and presumably oncogenic mutation of BRAF, which is BRAF(V599Ins).", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article"], "relationships": [{"type": "same_gene", "rank": 10, "why": "Same gene HRAS. Chronological rank 10 among non-review papers in the 8-year horizon.", "passage": "ObjectivesThe genes RET and RAS, and more recently BRAF, have been shown to be frequently mutated in human papillary thyroid carcinomas (PTC).", "matched_terms": []}, {"type": "text_similarity", "rank": 19, "why": "Cosine 0.92 between this abstract and the claim statement.", "passage": "The aim of this study was to genotype for these mutations a cohort of thyroid tumours collected at our institutions.Design and patientsThyroid tumours removed from 51 subjects were analysed, including 43 PTC ion.", "pub_types": ["Journal Article", "case-report"], "relationships": [{"type": "text_similarity", "rank": 13, "why": "Cosine 0.94 between this abstract and the claim statement.", "passage": "The patients were initially diagnosed with Costello syndrome, an autosomal recessive inheritance was assumed.", "matched_terms": ["HRAS", "Costello"]}, {"type": "experimental", "rank": 1, "why": "Experimental query matched HRAS, Costello.", "passage": "The patients were initially diagnosed with Costello syndrome, an autosomal recessive inheritance was assumed.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["combination", "text_similarity", "experimental"]}, {"pmid": "22098123", "year": 2012, "date": "2012-03-01", "title": "Dermatological phenotype in Costello syndrome: consequences of Ras dysregulation in development.", "abstract": "BackgroundThe RASopathies are a class of human genetic syndromes caused by germline mutations in genes that encode protein components of the Ras/mitogen-activated protein kinase (MAPK) pathway. Costello syndrome (CS) is a RASopathy caused by mutations in the HRAS gene, a key regulator of signal transduction.ObjectiveTo quantify the specific cutaneous phenotype observed in 46 individuals with Costello syndrome with confirmed HRAS mutations.MethodsThis was a cross-sectional study. Dermatological surveys were designed by the authors and were completed by parents of mutation-positive individuals with CS at the Costello Syndrome Family Network (CSFN) conferences in 2007 and 2009. Dermatological examinations were performed by the authors at the CSFN conferences.ResultsCutaneous papillomas were reported in 33 of the 46 (72%) participants, with age of onset ranging from infancy to 22years. Individuals with CS are more likely than patients with cardiofaciocutaneous syndrome (CFC) to present with cutaneous papillomas (72% vs. 5%, PConclusionsWhile there is significant phenotypic overlap among syndromes of the Ras/MAPK pathway, individuals with CS are more likely than individuals with CFC syndrome to present with cutaneous papillomas, palmoplantar keratoderma and full eyebrows, and are less likely to present with ulerythema ophryogenes, keratosis pilaris or multiple naevi. The dermatological features of CS, a Ras dysregulation syndrome, share many features with cutaneous paraneoplastic syndromes. This may provide further insight into the role of Ras signalling in cutaneous paraneoplastic syndromes.", "pub_types": ["research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "citation", "rank": 11, "why": "Cites PMID 16372351. Matched terms: HRAS, Costello.", "passage": "Costello syndrome (CS) is a RASopathy caused by mutations in the HRAS gene, a key regulator of signal transduction.ObjectiveTo quantify the specific cutaneous phenotype observed in 46 individuals with Costello syndrome with confirmed HRAS mutations.MethodsThis was a cross-sectional study.", "matched_terms": ["HRAS", "Costello"]}, {"type": "experimental", "rank": 6, "why": "Experimental query matched HRAS, Costello.", "passage": "Costello syndrome (CS) is a RASopathy caused by mutations in the HRAS gene, a key regulator of signal transduction.ObjectiveTo quantify the specific cutaneous phenotype observed in 46 individuals with Costello syndrome with confirmed HRAS mutations.MethodsThis was a cross-sectional study.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["combination", "citation", "experimental"]}, {"pmid": "22495892", "year": 2012, "date": "2012-04-11", "title": "Neonatal lethal Costello syndrome and unusual dinucleotide deletion/insertion mutations in HRAS predicting p.Gly12Val.", "abstract": "De novo heterozygous mutations in HRAS cause Costello syndrome (CS), a condition with high mortality and morbidity in infancy and early childhood due to cardiac, respiratory, and muscular complications. HRAS mutations predicting p.Gly12Val, p.Gly12Asp, and p.Gly12Cys substitutions have been associated with severe, lethal, CS. We report on molecular, clinical, and pathological findings in patients with mutations predicting HRAS p.Gly12Val that were identified in our clinical molecular genetic testing service. Such mutations were identified in four patients. Remarkably, three were deletion/insertion mutations affecting coding nucleotides 35 and 36. All patients died within 6 postnatal weeks, providing further evidence that p.Gly12Val mutations predict a very poor prognosis. High birth weight, polyhydramnios (and premature birth), cardiac hypertrophy, respiratory distress, muscle weakness, and postnatal growth failure were present. Dysmorphism was subtle or non-specific, with edema, coarsened facial features, prominent forehead, depressed nasal bridge, anteverted nares, and low-set ears. Proximal upper limb shortening, a small bell-shaped chest, talipes, and fixed flexion deformities of the wrists were seen. Neonatal atrial arrhythmia, highly suggestive of CS, was also present in two patients. One patient had congenital alveolar dysplasia, and another, born after 36 weeks' gestation, bronchopulmonary dysplasia. A rapidly fatal disease course, and the difficulty of identifying subtle dysmorphism in neonates requiring intensive care, suggest that this condition remains under-recognized, and should enter the differential diagnosis for very sick infants with a range of clinical problems including cardiac hypertrophy and disordered pulmonary development. Clinical management should be informed by knowledge of the poor prognosis of this condition.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Case Reports"], "relationships": [{"type": "text_similarity", "rank": 7, "why": "Cosine 0.96 between this abstract and the claim statement.", "passage": "De novo heterozygous mutations in HRAS cause Costello syndrome (CS), a condition with high mortality and morbidity in infancy and early childhood due to cardiac, respiratory, and muscular complications.", "matched_terms": ["HRAS", "Costello"]}, {"type": "experimental", "rank": 2, "why": "Experimental query matched HRAS, Costello.", "passage": "De novo heterozygous mutations in HRAS cause Costello syndrome (CS), a condition with high mortality and morbidity in infancy and early childhood due to cardiac, respiratory, and muscular complications.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["combination", "text_similarity", "experimental"]}, {"pmid": "23791108", "year": 2013, "date": "2013-06-20", "title": "Gain-of-function mutations in RIT1 cause Noonan syndrome, a RAS/MAPK pathway syndrome.", "abstract": "RAS GTPases mediate a wide variety of cellular functions, including cell proliferation, survival, and differentiation. Recent studies have revealed that germline mutations and mosaicism for classical RAS mutations, including those in HRAS, KRAS, and NRAS, cause a wide spectrum of genetic disorders. These include Noonan syndrome and related disorders (RAS/mitogen-activated protein kinase [RAS/MAPK] pathway syndromes, or RASopathies), nevus sebaceous, and Schimmelpenning syndrome. In the present study, we identified a total of nine missense, nonsynonymous mutations in RIT1, encoding a member of the RAS subfamily, in 17 of 180 individuals (9%) with Noonan syndrome or a related condition but with no detectable mutations in known Noonan-related genes. Clinical manifestations in the RIT1-mutation-positive individuals are consistent with those of Noonan syndrome, which is characterized by distinctive facial features, short stature, and congenital heart defects. Seventy percent of mutation-positive individuals presented with hypertrophic cardiomyopathy; this frequency is high relative to the overall 20% incidence in individuals with Noonan syndrome. Luciferase assays in NIH 3T3 cells showed that five RIT1 alterations identified in children with Noonan syndrome enhanced ELK1 transactivation. The introduction of mRNAs of mutant RIT1 into 1-cell-stage zebrafish embryos was found to result in a significant increase of embryos with craniofacial abnormalities, incomplete looping, a hypoplastic chamber in the heart, and an elongated yolk sac. These results demonstrate that gain-of-function mutations in RIT1 cause Noonan syndrome and show a similar biological effect to mutations in other RASopathy-related genes.", "pub_types": ["brief-report", "Research Support, Non-U.S. Gov't", "Journal Article"], "relationships": [{"type": "text_similarity", "rank": 20, "why": "Cosine 0.92 between this abstract and the claim statement.", "passage": "Recent studies have revealed that germline mutations and mosaicism for classical RAS mutations, including those in HRAS, KRAS, and NRAS, cause a wide spectrum of genetic disorders.", "matched_terms": ["HRAS"]}, {"type": "experimental", "rank": 7, "why": "Experimental query matched HRAS.", "passage": "Recent studies have revealed that germline mutations and mosaicism for classical RAS mutations, including those in HRAS, KRAS, and NRAS, cause a wide spectrum of genetic disorders.", "matched_terms": ["HRAS"]}], "in_packet": false, "in_budget": ["combination", "text_similarity", "experimental"]}, {"pmid": "15965904", "year": 2006, "date": "2006-01-01", "title": "TP53 mutations and S-phase fraction but not DNA-ploidy are independent prognostic indicators in laryngeal squamous cell carcinoma.", "abstract": "To prospectively evaluate the prognostic significance of TP53, H-, K-, and N-Ras mutations, DNA-ploidy and S-phase fraction (SPF) in patients affected by locally advanced laryngeal squamous cell carcinoma (LSCC). Eight-one patients (median follow-up was 71 months) who underwent resective surgery for primary operable locally advanced LSCC were analyzed. Tumor DNA was screened for mutational analysis by PCR/SSCP and sequencing. DNA-ploidy and SPF were performed by flow cytometric analyses. Thirty-six patients (44%) had, at least, a mutation in the TP53 gene. Of them, 22% (8/36) had double mutations and 3% (1/36) had triple mutations. In total, 46 TP53 mutations were observed. The majority (41%) of these occur in exon 5 (19/46), while the mutations in exons 6, 7, and 8 were represented in 14, 7, and 6 patients, respectively (31%, 15%, and 16%). Five LSCC patients (6%) showed a mutation in H-Ras gene. Sixty-three percent of the cases (51/81) were DNA aneuploidy, 14% of these (7/51) were multiclonal. Thirty-nine patients (48%) had an high SPF value. At Univariate analysis, the DNA aneuploidy, high SPF (>15.1%), TP53 mutations and, in particular, the mutations that occur in exons 5 and 8 were significantly related to quicker disease relapse and short OS. At Multivariate analysis, the major significant predictors for both disease relapse and death were high SPF and any TP53 mutations. While histological grade G3 was an independent factor only for relapse. In conclusions, any TP53 mutations and high SPF are important biological indicators to predict the outcome of LSCC patients.", "pub_types": ["Journal Article"], "relationships": [{"type": "same_gene", "rank": 15, "why": "Same gene HRAS. Chronological rank 15 among non-review papers in the 8-year horizon.", "passage": "To prospectively evaluate the prognostic significance of TP53, H-, K-, and N-Ras mutations, DNA-ploidy and S-phase fraction (SPF) in patients affected by locally advanced laryngeal squamous cell carcinoma (LSCC).", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16354683", "year": 2006, "date": "2006-01-01", "title": "Distinct utilization of effectors and biological outcomes resulting from site-specific Ras activation: Ras functions in lipid rafts and Golgi complex are dispensable for proliferation and transformation.", "abstract": "Ras proteins are distributed in different types of plasma membrane microdomains and endomembranes. However, how microlocalization affects the signals generated by Ras and its subsequent biological outputs is largely unknown. We have approached this question by selectively targeting RasV12 to different cellular sublocalizations. We show here that compartmentalization dictates Ras utilization of effectors and the intensity of its signals. Activated Ras can evoke enhanced proliferation and transformation from most of its platforms, with the exception of the Golgi complex. Furthermore, signals that promote survival emanate primarily from the endoplasmic reticulum pool. In addition, we have investigated the need for the different pools of endogenous Ras in the conveyance of upstream mitogenic and transforming signals. Using targeted RasN17 inhibitory mutants and in physiological contexts such as H-Ras/N-Ras double knockout fibroblasts, we demonstrate that Ras functions at lipid rafts and at the Golgi complex are fully dispensable for proliferation and transformation.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article"], "relationships": [{"type": "same_gene", "rank": 12, "why": "Same gene HRAS. Chronological rank 12 among non-review papers in the 8-year horizon.", "passage": "Ras proteins are distributed in different types of plasma membrane microdomains and endomembranes.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16364763", "year": 2006, "date": "2006-01-01", "title": "Previously unidentified complex cytogenetic changes found in a pediatric case of solid-pseudopapillary neoplasm of the pancreas.", "abstract": "Solid pseudopapillary neoplasm of the pancreas (SPNP) is a rare tumor with low malignant potential found in adolescent girls and young women. The pathogenesis of SPNP remains uncertain and its management is controversial. Genetic changes associated with SPNP have seldom been reported. We describe here the cytogenetic investigation of a case of SPNP in a 13-year-old girl whose tumor cells revealed two unrelated clones: one clone characterized by complex karyotypic changes, including breakpoints in two common fragile sites at chromosome 2, band q33, and chromosome 4, band q31, and the second clone defined by partial monosomy for chromosome X. Loss of heterozygosity for HRAS was also identified by array comparative genomic hybridization (a-CGH). These cumulative changes seem insufficient for activation of cell transformation, but could possibly play a role in priming the cell for future mutagenic events.", "pub_types": ["Journal Article"], "relationships": [{"type": "same_gene", "rank": 13, "why": "Same gene HRAS. Chronological rank 13 among non-review papers in the 8-year horizon.", "passage": "Solid pseudopapillary neoplasm of the pancreas (SPNP) is a rare tumor with low malignant potential found in adolescent girls and young women.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16392807", "year": 2006, "date": "2006-01-01", "title": "Novel transplatinum(II) complexes with [N2O2] donor sets. Cellular pharmacology and apoptosis induction in Pam 212-ras cells.", "abstract": "Cellular pharmacological properties of eight trans-picoline platinum(II) complexes of formula trans-[PtX(2)(L)(L')], where X = Cl or CH(3)COO (OAc) and L = L' = 3-picoline (3-pic), 4-picoline (4-pic) or L = NH(3) and L' = 3-pic or 4-pic, were investigated in murine keratinocyte Pam 212 cells and Pam 212-ras cells, murine tumor keratinocytes derived from transformation with a viral vector containing the H-ras oncogene. The derivatives trans-[Pt(OAc)(2)(L)(L')] (L = L' = 3-pic, 9, and L = L' = 4-pic, 10) were able to circumvent resistance in Pam 212-ras cells. Although all the trans-picoline platinum(II) acetate derivatives showed a similar level of DNA binding, there were remarkable differences in cellular accumulation: the complexes having two picoline ligands (9, 10) had a much higher intracellular accumulation than those having mixed picoline and ammine ligands (11, 12). No significant differences in cellular pharmacological properties have been observed between isomers having 3- or 4-picoline.", "pub_types": ["Research Support, Non-U.S. Gov't", "Research Support, U.S. Gov't, Non-P.H.S.", "Journal Article"], "relationships": [{"type": "same_gene", "rank": 11, "why": "Same gene HRAS. Chronological rank 11 among non-review papers in the 8-year horizon.", "passage": "Cellular pharmacological properties of eight trans-picoline platinum(II) complexes of formula trans-[PtX(2)(L)(L')], where X = Cl or CH(3)COO (OAc) and L = L' = 3-picoline (3-pic), 4-picoline (4-pic) or L = NH(3) and L' = 3-pic or 4-pic, were investigated in murine keratinocyte Pam 212 cells and Pam 212-ras cells, murine tumor keratinocytes derived from transformation with a viral vector containing the H-ras oncogene.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16428512", "year": 2006, "date": "2006-01-01", "title": "Identification of insulin-like growth factor binding protein-3 as a farnesyl transferase inhibitor SCH66336-induced negative regulator of angiogenesis in head and neck squamous cell carcinoma.", "abstract": "The farnesyl transferase inhibitor (FTI) SCH66336 has been shown to have antitumor activities in head and neck squamous cell carcinoma (HNSCC) in vitro and in vivo. However, its mechanism of action has not been well defined. Here, we report that the insulin-like growth factor (IGF) binding protein (IGFBP)-3 mediates antitumor activities of SCH66336 in HNSCC by inhibiting angiogenesis. SCH66336 significantly suppressed HNSCC tumor growth and angiogenesis via mechanisms that are independent of H-Ras and RhoB. By inducing IGFBP-3 secretion from HNSCC cells, this compound suppresses angiogenic activities of endothelial cells, including vessel formation in chorioallantoic membranes of chick, endothelial cell sprouting from chick aorta, and capillary tube formation of human umbilical vascular endothelial cells (HUVEC). Knockdown of IGFBP-3 expression in HNSCC cells by RNA interference or depletion of IGFBP-3 in HUVECs by neutralizing antibody effectively blocked the effects of IGFBP-3 secreted from SCH66336-treated HNSCC cells on HUVECs. These findings suggest that IGFBP-3 could be a primary target for antitumor activities of FTIs and that IGFBP-3 is an effective therapeutic approach against angiogenesis in HNSCC.", "pub_types": ["Research Support, Non-U.S. Gov't", "Research Support, U.S. Gov't, Non-P.H.S.", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "same_gene", "rank": 9, "why": "Same gene HRAS. Chronological rank 9 among non-review papers in the 8-year horizon.", "passage": "The farnesyl transferase inhibitor (FTI) SCH66336 has been shown to have antitumor activities in head and neck squamous cell carcinoma (HNSCC) in vitro and in vivo.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16443854", "year": 2006, "date": "2006-01-27", "title": "Genotype-phenotype correlation in Costello syndrome: HRAS mutation analysis in 43 cases.", "abstract": "BackgroundCostello syndrome (CS) is a rare multiple congenital abnormality syndrome, associated with failure to thrive and developmental delay. One of the more distinctive features in childhood is the development of facial warts, often nasolabial and in other moist body surfaces. Individuals with CS have an increased risk of malignancy, suggested to be about 17%. Recently, mutations in the HRAS gene on chromosome 11p13.3 have been found to cause CS.MethodsWe report here the results of HRAS analysis in 43 individuals with a clinical diagnosis of CS.ResultsMutations were found in 37 (86%) of patients. Analysis of parental DNA samples was possible in 16 cases for both parents and in three cases for one parent, and confirmed the mutations as de novo in all of these cases. Three novel mutations (G12C, G12E, and K117R) were found in five cases.ConclusionsThese results confirm that CS is caused, in most cases, by heterozygous missense mutations in the proto-oncogene HRAS. Analysis of the major phenotypic features by mutation suggests a potential correlation between malignancy risk and genotype, which is highest for patients with an uncommon (G12A) substitution. These results confirm that mutation testing for HRAS is a reliable diagnostic test for CS.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Case Reports"], "relationships": [{"type": "shared_references", "rank": 1, "why": "Cites source references: 16170316.", "passage": "BackgroundCostello syndrome (CS) is a rare multiple congenital abnormality syndrome, associated with failure to thrive and developmental delay.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": true, "in_budget": ["combination"]}, {"pmid": "16449633", "year": 2006, "date": "2006-02-01", "title": "The retinoblastoma protein is required for Ras-induced oncogenic transformation.", "abstract": "Most human cancers involve either mutational activation of the Ras oncogenic pathway and/or inactivation of the retinoblastoma tumor suppressor (RB) pathway. Paradoxically, tumors that harbor Ras mutations almost invariably retain expression of a wild-type pRB protein. We explain this phenomenon by demonstrating that Ras-induced oncogenic transformation surprisingly depends on functional pRB protein. Cells lacking pRB are less susceptible to the oncogenic actions of H-RasV12 than wild-type cells and activated Ras has an inhibitory effect on the proliferation of pRB-deficient human tumor cells. In addition, depletion of pRB from Ras-transformed murine cells or human tumor cells that harbor Ras pathway mutations inhibits their proliferation and anchorage-independent growth. In sharp contrast to pRB-/- 3T3 cells, fibroblasts deficient in other pRB family members (p107 and p130) are more susceptible to Ras-mediated transformation than wild-type 3T3 cells. Moreover, loss of pRB in tumor cells harboring a Ras mutation results in increased expression of p107, and overexpression of p107 but not pRB strongly inhibits proliferation of these tumor cells. Together, these findings suggest that pRB and p107 have distinct roles in Ras-mediated transformation and suggest a novel tumor-suppressive role for p107 in the context of activated Ras.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "same_gene", "rank": 19, "why": "Same gene HRAS. Chronological rank 19 among non-review papers in the 8-year horizon.", "passage": "Most human cancers involve either mutational activation of the Ras oncogenic pathway and/or inactivation of the retinoblastoma tumor suppressor (RB) pathway.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16458120", "year": 2006, "date": "2006-02-01", "title": "Chronic renal failure rats are highly sensitive to aristolochic acids, which are nephrotoxic and carcinogenic agents.", "abstract": "Aristolochic acid (AA), a component of some Chinese herbal medicines, may cause Chinese Herbs Nephropathy (CHN) and multi-systemic tumors by the formation of AA-DNA adducts. In this study, we established an animal model to further characterize the mechanisms of AA-induced diseases. Our results indicated that AA significantly inhibited rat growth in terms of weight gain. By measuring the serum creatinine levels, AA resulted in considerable damage to the rat renal system, not only for those in which chronic renal failure (CRF) was induced but also for normal healthy rats. Mutation-specific polymerase chain reaction (PCR) and XbaI restriction fragment length polymorphism (RFLP) revealed the CAA-->CTA transversion mutation at codon 61 of the H-ras proto-oncogene from the stomach tissues of CRF rats fed with AA, but not from other tissues of rats in the same experimental group. In addition, no such mutations were found in the tissues of CRF rats without AA treatment or healthy rats fed with AA. Our results strongly demonstrated that AA was in fact nephrotoxic and carcinogenic, especially to those CRF rats.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article"], "relationships": [{"type": "same_gene", "rank": 18, "why": "Same gene HRAS. Chronological rank 18 among non-review papers in the 8-year horizon.", "passage": "Aristolochic acid (AA), a component of some Chinese herbal medicines, may cause Chinese Herbs Nephropathy (CHN) and multi-systemic tumors by the formation of AA-DNA adducts.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16488996", "year": 2006, "date": "2006-02-01", "title": "Ras and its signals diffuse through the cell on randomly moving nanoparticles.", "abstract": "Spatiotemporal modulation of Ras signaling from different intracellular compartments requires mechanisms allowing Ras and its signals to navigate across cells. Here, we describe one mechanism by which clusters of palmitoylated H-Ras and N-Ras isoforms but not nonpalmitoylated K-Ras diffuse through the cytoplasm, independently of ATP, on fast, randomly moving, small cytosolic nanoparticles (\"rasosomes\"). Rasosomes forced to diffuse out of live cells and trapped by Ras antibody beads appear as round structures of 80- to 100-nm diameter. Association of H-Ras with rasosomes requires Ras palmitoylation and the hypervariable sequence (hvr) upstream of the palmitoylated cysteines. H-Ras hvr mutants that fail to interact with rasosomes are biologically inactive. Epidermal growth factor stimulation rapidly increases active H-Ras-GTP and phosphorylated extracellular signal-regulated kinase (ERK) on rasosomes. Similarly, rasosomes carrying H-Ras(G12V) but not H-Ras are loaded with active ERK. Thus, the rasosome represents a hitherto unknown particle that enables Ras signal information to spread rapidly across cells.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article"], "relationships": [{"type": "same_gene", "rank": 17, "why": "Same gene HRAS. Chronological rank 17 among non-review papers in the 8-year horizon.", "passage": "Spatiotemporal modulation of Ras signaling from different intracellular compartments requires mechanisms allowing Ras and its signals to navigate across cells.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16505104", "year": 2006, "date": "2006-02-01", "title": "RRR-alpha-tocopherol succinate down-regulates oncogenic Ras signaling.", "abstract": "alpha-Tocopherol succinate (TS), an analogue of vitamin E, has growth-inhibitory activity in a wide spectrum of in vitro and in vivo cancer models. Here, we report that modulation of oncogenic Ras is associated with TS activity. TS inhibits the proliferation and induces apoptosis of NIH3T3 cells stably transfected with oncogenic K-Ras and H-Ras, but not NIH3T3 cells expressing empty vector. TS treatment resulted in decreased Ras protein levels in oncogenic Ras expressing NIH3T3 cells but not in parental NIH3T3 cells. Treatment with TS suppressed the levels of phospho-Akt and phospho-Erk1/2 in oncogenic Ras expressing NIH3T3 cells. Overexpression of constitutively active phosphoinositide-3-kinase, Akt, and Mek1/2 significantly attenuated TS growth inhibition of oncogenic Ras-transformed NIH3T3 mouse fibroblast cell lines. In addition, transcriptional targets of oncogenic Ras such as c-Myc, cyclin D1, and E2F1 were down-regulated by TS in oncogenic Ras-expressing cells. The above TS effects on oncogenic Ras signaling were also observed in endogenous oncogenic K-Ras expressing HCT 116 (human colon cancer) and MDA-MB-231 (human breast cancer) cells. Taken together, these data show that TS down-regulation of the Ras signaling pathways that are mediated by Mek/Erk and phosphoinositide-3-kinase/Akt plays, at least in part, a critical role in TS inhibition of proliferation and survival of transformed cells. This data supports further investigation of the chemopreventive and therapeutic potential of TS in tumors that are dependent on activated Ras signaling and identifies phosphor-Erk and phosphor-Akt as potential biomarkers of TS activity.", "pub_types": ["Journal Article"], "relationships": [{"type": "same_gene", "rank": 16, "why": "Same gene HRAS. Chronological rank 16 among non-review papers in the 8-year horizon.", "passage": "alpha-Tocopherol succinate (TS), an analogue of vitamin E, has growth-inhibitory activity in a wide spectrum of in vitro and in vivo cancer models.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16572589", "year": 2006, "date": "2006-01-01", "title": "Elucidation of stannin function using microarray analysis: implications for cell cycle control.", "abstract": "Stannin (Snn) is a highly conserved, vertebrate protein whose cellular function is unclear. We have recently demonstrated in human umbilical vein endothelial cells (HUVECs) that Snn gene expression is significantly induced by tumor necrosis factor-alpha (TNF-alpha) in a protein kinase C-epsilon (PKC-epsilon)-dependent manner. In HUVEC, TNF-alpha stimulation of HUVECs results in altered gene expression, and a slowing or halting of cell growth. An initial set of experiments established that Snn knockdown via siRNA, prior to TNF-alpha treatment, resulted in a significant inhibition of HUVEC growth compared to TNF-alpha treatment alone. In order to assess how Snn may be involved in TNF-alpha signaling in HUVEC growth arrest, we performed microarray analysis of TNF-alpha-stimulated HUVECs with and without Snn knockdown via siRNA. The primary comparison made was between TNF-alpha-stimulated HUVECs and TNF-alpha-exposed HUVECs that had Snn knocked down via Snn-specific siRNAs. Ninety-six genes were differentially expressed between these two conditions. Of particular interest was the significant upregulation of several genes associated with control of cell growth and/or the cell cycle, including interleukin-4, p29, WT1/PRKC, HRas-like suppressor, and MDM4. These genes act upon cyclin D1 and/or p53, both of which are key regulators of the G1 phase of the cell cycle. Functional studies further supported the role of Snn in cell growth, as cell cycle analysis using flow cytometry shows a significant increase of G1 cell cycle arrest in HUVECs with Snn knockdown in response to TNF-alpha treatment. Together these studies suggest a functional role of Snn in regulation of TNF-alpha-induced signaling associated with HUVEC growth arrest.", "pub_types": ["research-article", "Journal Article"], "relationships": [{"type": "same_gene", "rank": 8, "why": "Same gene HRAS. Chronological rank 8 among non-review papers in the 8-year horizon.", "passage": "Stannin (Snn) is a highly conserved, vertebrate protein whose cellular function is unclear.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16575466", "year": 2006, "date": "2006-01-01", "title": "A disconnect between antitumor and antiangiogenic effects of fluvastatin in vitro and in vivo.", "abstract": "The possible role of statins in cancer is controversial. Indeed, among the multiplicity of biological effects ascribed to these widely used cholesterol lowering agents some could, at least in theory, inhibit tumor growth (e.g. by inhibiting Ras oncoproteins), while other actions are inert, or may even stimulate cancer aggressiveness (e.g. through promoting neovascularization). In order to address some of these controversies, we set out to compare the effects of statins on growth of cancer and endothelial cells in vitro, to the impact of these drugs on angiogenesis-dependent expansion of the corresponding tumors in vivo. Water-soluble fluvastatin was used at concentrations (0-800 ng/ml) against human umbilical vein endothelial cells (HUVEC), and several well-characterized cancer cell lines in culture, including: carcinoma (LLC), melanoma (B16F1) and fibrosarcoma driven by mutant H-ras (528ras1). Endpoints were based on 3H-thymidine incorporation assay, cell morphology and tumorigenicity in mice. The growth inhibitory effects of fluvastatin varied among cancer cell lines (LLC>B16F1>528ras1), irrespectively of their mutant H-ras status. Fluvastatin also blocked the action of angiogenic factors on cultured endothelial cells, but was relatively ineffective against highly angiogenic and aggressive tumors both in young mice (6-8 weeks), and in less aggressively growing tumors in aged (80-90 weeks) mice. Thus, antitumor and antiangiogenic activity of fluvastatin in vitro is not recapitulated in vivo. Tumors may display a form of resistance to statins through a mechanism operative only in vivo.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article"], "relationships": [{"type": "same_gene", "rank": 7, "why": "Same gene HRAS. Chronological rank 7 among non-review papers in the 8-year horizon.", "passage": "The possible role of statins in cancer is controversial.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16757335", "year": 2006, "date": "2006-01-01", "title": "RAS and the RAIN/RasIP1 effector.", "abstract": "Ras proteins function as signaling nodes that are activated by extracellular stimuli. On activation, Ras interacts with a spectrum of functionally diverse downstream effectors and stimulates a variety of downstream cytoplasmic signaling cascades that regulate cellular proliferation, differentiation, and apoptosis. In addition to the association of Ras with the plasma membrane, recent studies have established an association of Ras with Golgi membranes and showed that H-Ras and N-Ras are activated on endomembranes and signal to regulate downstream pathways. Whereas the effectors of signal transduction by activated, plasma membrane-localized Ras are well characterized, very little is known about the effectors used by Golgi-associated Ras. Recently, we have reported the identification of the first endomembrane Ras effector molecule, RAIN. This chapter details the methods used to study RAIN-Ras interaction and localization in vivo. In addition, we describe the tools and methods we have used to explore role of endogenous RAIN in endothelial cells.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article"], "relationships": [{"type": "same_gene", "rank": 6, "why": "Same gene HRAS. Chronological rank 6 among non-review papers in the 8-year horizon.", "passage": "Ras proteins function as signaling nodes that are activated by extracellular stimuli.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16757336", "year": 2006, "date": "2006-01-01", "title": "The RIN family of Ras effectors.", "abstract": "The human RIN1 gene was first identified as a cDNA fragment that interfered with RAS-induced phenotypes in the yeast Saccharomyces cerevisiae. Subsequent analysis of full-length RIN1 clones showed that the protein product of this gene is a downstream effector of RAS and binds with high affinity and specificity to activated HRAS. Two downstream RIN1 effector pathways have been described. The first involves direct activation of RAB5-mediated endocytosis. The second involves direct activation of ABL tyrosine kinase activity. Importantly, each of these distinct RIN1 functions is enhanced by activated RAS, suggesting that RIN1 represents a unique class of RAS effector connected to two independent signaling pathways. In this chapter, we summarize our assays and approaches for evaluating the biochemistry and biology of RIN1.", "pub_types": ["Research Support, U.S. Gov't, Non-P.H.S.", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "same_gene", "rank": 5, "why": "Same gene HRAS. Chronological rank 5 among non-review papers in the 8-year horizon.", "passage": "The human RIN1 gene was first identified as a cDNA fragment that interfered with RAS-induced phenotypes in the yeast Saccharomyces cerevisiae.", "matched_terms": []}], "in_packet": false, "in_budget": ["same_gene"]}, {"pmid": "16757341", "year": 2006, "date": "2006-01-01", "title": "Ras up-regulation of cyclooxygenase-2.", "abstract": "Oncogenic mutations in Ras (H-Ras, N-Ras, and K-Ras) are found in a wide variety of human malignancies, including adenocarcinomas of the colon, where K-Ras mutations often occur early in tumor development and strongly correlate with the transition to invasive adenocarcinoma. Our laboratory is interested in examining the interaction between Ras signaling and up-regulation of cyclooxygenase-2 (COX-2), a key regulator of prostaglandin biosynthesis. Our studies demonstrate that the Ras oncoprotein can regulate transcriptional activation and stabilization of COX-2 expression by several mechanisms. In this chapter we have outlined protocols and experimental approaches used in our laboratory to measure H-Ras up-regulation of COX-2 expression and to elaborate on more recent techniques that illustrate the importance of activation of Ras by prostaglandin E2 (PGE(2)). These methods have facilitated our understanding of the mechanisms by which the COX-2-derived PGE(2) and Ras activation of the mitogen-activated protein kinase (MAPK) signaling promotes oncogenic transformation. In light of the critical roles of both COX-2 and Ras signaling in carcinogenesis, our understanding of the complete signaling nuances between different isoforms of Ras on activation of COX-2, as well as understanding the novel mechanism whereby COX-2-derived PGE(2) constitutively activates Ras, will potentially aid in the identification of new targets for cancer therapy.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "same_gene", "rank": 4, "why": "Same gene HRAS. Chronological rank 4 among non-review papers in the 8-year horizon.", "passage": "Oncogenic mutations in Ras (H-Ras, N-Ras, and K-Ras) are found in a wide variety of human malignancies, including adenocarcinomas of the colon, where K-Ras mutations often occur early in tumor development and strongly correlate with the transition to invasive adenocarcinoma.", "matched_terms": []}], "in_packet": false, "in_budget": ["combination", "same_gene"]}, {"pmid": "16757360", "year": 2006, "date": "2006-01-01", "title": "Use of Ras-transformed human ovarian surface epithelial cells as a model for studying ovarian cancer.", "abstract": "The Ras gene family has been implicated in the development of many human epithelial cancers. Mutations in K-ras or its downstream mediator BRAF have been detected in about two thirds of low-grade serous carcinomas and borderline serous tumors; mutations in K-ras are also often present in benign and invasive mucinous ovarian cancers. Although the oncogenic allele H-ras(V12) is present in only approximately 6% of ovarian cancers, physiologically activated H-ras protein is commonly detected in human ovarian cancer, presumably because of an increase in upstream signals from tyrosine kinase growth factor receptors such as Her-2/neu, despite the lack of a Ras mutation. The mechanisms by which ras oncogenes transform human epithelial cells are not clear. The methods described here are what we use to culture human ovarian surface epithelial cells, to immortalize those cells, and to transform the immortalized cells with oncogenic H-ras or K-ras. These Ras-transformed human ovarian surface epithelial cells form tumors in nude mice and recapitulate many features of human ovarian cancer, thus providing an excellent model system for studying the initiation and progression of human ovarian cancer.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "same_gene", "rank": 3, "why": "Same gene HRAS. Chronological rank 3 among non-review papers in the 8-year horizon.", "passage": "The Ras gene family has been implicated in the development of many human epithelial cancers.", "matched_terms": []}], "in_packet": false, "in_budget": ["combination", "same_gene"]}, {"pmid": "17085783", "year": 2006, "date": "2006-01-01", "title": "ErbB4 activation inhibits MPP+-induced cell death in PC12-ErbB4 cells: involvement of PI3K and Erk signaling.", "abstract": "The neuroprotective effects of neuregulin (NRG), a polypeptide growth factor, on 1-methyl-4-phenylpyridinium ion (MPP+)-induced cell death and oxidative stress in PC12-ErbB4 cells were investigated. Treatment of PC12-ErbB4 cells with MPP+ induced cell death that was markedly attenuated by NRG. The PI3K/PKB/Akt and Ras/MapK signaling pathways probably mediate the survival effect of NRG. NRG induces prolonged activation of PKB/Akt and Erk. Moreover, inhibition of the PI3K and MEK activities prevented the NRG-induced survival effect. Overexpression of constitutively active PI3K or H-Ras (12V) inhibited MPP+-mediated cell death. In addition, MPP+- mediated reactive oxygen species (ROS) elevation was also inhibited by NRG. The effect of NRG on ROS levels was blocked by PI3K and MEK inhibitors, indicating that both signaling pathways can regulate the toxic ROS levels induced by MPP+. Taken together, these results indicate that in PC12-ErbB4 cells, the NRG-induced neuroprotective effect from MPP+ treatment, requires PI3K/PKB/Akt and Ras/MapK signaling networks.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article"], "relationships": [{"type": "same_gene", "rank": 2, "why": "Same gene HRAS. Chronological rank 2 among non-review papers in the 8-year horizon.", "passage": "The neuroprotective effects of neuregulin (NRG), a polypeptide growth factor, on 1-methyl-4-phenylpyridinium ion (MPP+)-induced cell death and oxidative stress in PC12-ErbB4 cells were investigated.", "matched_terms": []}], "in_packet": false, "in_budget": ["combination", "same_gene"]}, {"pmid": "17162533", "year": 2006, "date": "2006-01-01", "title": "Frequent p53 and H-ras mutations in benzene- and ethylene oxide-induced mammary gland carcinomas from B6C3F1 mice.", "abstract": "Benzene and ethylene oxide are multisite carcinogens in rodents and classified as human carcinogens by the National Toxicology Program. In 2-year mouse studies, both chemicals induced mammary carcinomas. We examined spontaneous, benzene-, and ethylene oxide-induced mouse mammary carcinomas for p53 protein expression, using immunohistochemistry, and p53 (exons 5-8) and H-ras (codon 61) mutations using cycle sequencing techniques. p53 protein expression was detected in 42% (8/19) of spontaneous, 43% (6/14) of benzene-, and 67% (8/12) of ethylene oxide-induced carcinomas. However, semiquantitative evaluation of p53 protein expression revealed that benzene- and ethylene oxide-induced carcinomas exhibited expression levels five- to six-fold higher than spontaneous carcinomas. p53 mutations were found in 58% (7/12) of spontaneous, 57% (8/14) of benzene-, and 67% (8/12) of ethylene oxide-induced carcinomas. H-ras mutations were identified in 26% (5/19) of spontaneous, 50% (7/14) of benzene-, and 33% (4/12) of ethylene oxide-induced carcinomas. When H-ras mutations were present, concurrent p53 mutations were identified in 40% (2/5) of spontaneous, 71% (5/7) of benzene-, and 75% (3/4) of ethylene oxide-induced carcinomas. Our results demonstrate that p53 and H-ras mutations are relatively common in control and chemically induced mouse mammary carcinomas although both chemicals can alter the mutational spectra and more commonly induce concurrent mutations.", "pub_types": ["Research Support, N.I.H., Intramural", "Journal Article"], "relationships": [{"type": "same_gene", "rank": 1, "why": "Same gene HRAS. Chronological rank 1 among non-review papers in the 8-year horizon.", "passage": "Benzene and ethylene oxide are multisite carcinogens in rodents and classified as human carcinogens by the National Toxicology Program.", "matched_terms": []}], "in_packet": false, "in_budget": ["combination", "same_gene"]}, {"pmid": "17056636", "year": 2007, "date": "2006-10-20", "title": "Expansion of the genotypic and phenotypic spectrum in patients with KRAS germline mutations.", "abstract": "BackgroundNoonan syndrome, cardio-facio-cutaneous syndrome (CFC) and Costello syndrome constitute a group of developmental disorders with an overlapping pattern of congenital anomalies. Each of these conditions can be caused by germline mutations in key components of the highly conserved Ras-MAPK pathway, possibly reflecting a similar pathogenesis underlying the three disorders. Germline mutations in KRAS have recently been identified in a small number of patients with Noonan syndrome and CFC.Methods and results260 patients were screened for KRAS mutations by direct sequencing. Overall, we detected KRAS mutations in 12 patients, including three known and eight novel sequence alterations. All mutations are predicted to cause single amino acid substitutions. Remarkably, our cohort of individuals with KRAS mutations showed a high clinical variability, ranging from Noonan syndrome to CFC, and also included two patients who met the clinical criteria of Costello syndrome.ConclusionOur findings reinforce the picture of a clustered distribution of disease associated KRAS germline alterations. We further defined the phenotypic spectrum associated with KRAS missense mutations and provided the first evidence of clinical differences in patients with KRAS mutations compared with Noonan syndrome affected individuals with heterozygous PTPN11 mutations and CFC patients carrying a BRAF, MEK1 or MEK1 alteration, respectively. We speculate that the observed phenotypic variability may be related, at least in part, to specific genotypes and possibly reflects the central role of K-Ras in a number of different signalling pathways.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article", "case-report"], "relationships": [{"type": "citation", "rank": 1, "why": "Cites PMID 16372351. Matched terms: Costello.", "passage": "BackgroundNoonan syndrome, cardio-facio-cutaneous syndrome (CFC) and Costello syndrome constitute a group of developmental disorders with an overlapping pattern of congenital anomalies.", "matched_terms": ["Costello"]}], "in_packet": false, "in_budget": ["combination", "citation"]}, {"pmid": "17060457", "year": 2007, "date": "2006-10-23", "title": "Dormant Wnt-initiated mammary cancer can participate in reconstituting functional mammary glands.", "abstract": "The minimal residual disease foci that beget breast cancer relapse after a period of disease dormancy remain uncharacterized despite their enormous clinical importance. To model dormant breast cancer in vivo, we employed a transgenic mouse model in which Wnt1-initiated mammary cancer is doxycycline dependent. After regression of Wnt-dependent cancers, subclinical disease lesions were propagated in vivo using classical tissue recombination techniques. Surprisingly, outgrowths derived from dormant malignant tissue reconstituted morphologically normal ductal trees in wild-type mammary fat pads. Whereas hyperplasia-derived outgrowths remained benign, outgrowths derived from dormant malignancy underwent a morphological transition suggesting single-step transformation following reactivation of Wnt signaling and rapidly yielded invasive mammary tumors. Remarkably, outgrowths derived from dormant malignancy could be serially propagated in vivo and retained the potential to undergo lobuloalveolar differentiation in response to hormones of pregnancy. Matching somatic H-Ras mutations shared by antecedent tumors and descendant mammary ductal outgrowths confirmed their clonal relatedness. Thus, propagation of epithelium that possesses a latent malignant growth program reveals impressive regenerative and developmental potential, supporting the notion that dormant mammary cancers harbor transformed mammary progenitor cells. Our results define an experimental paradigm for elucidating biological properties of dormant malignancy.", "pub_types": ["research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "experimental", "rank": 12, "why": "Experimental query matched the structured query.", "passage": "The minimal residual disease foci that beget breast cancer relapse after a period of disease dormancy remain uncharacterized despite their enormous clinical importance.", "matched_terms": []}], "in_packet": false, "in_budget": ["experimental"]}, {"pmid": "17979197", "year": 2008, "date": "2008-02-01", "title": "Mutation analysis in Costello syndrome: functional and structural characterization of the HRAS p.Lys117Arg mutation.", "abstract": "Costello syndrome is a mental retardation syndrome characterized by high birth weight, postnatal growth retardation, coarse face, loose skin, cardiovascular problems, and tumor predisposition. De novo heterozygous missense mutations in HRAS codon 12 and 13 disturbing the intrinsic GTP hydrolysis cause Costello syndrome. We report a patient with typical Costello syndrome and a novel heterozygous missense mutation in codon 117 (c.350A>G, p.Lys117Arg) of the HRAS gene, resulting in constitutive activation of the RAS/MAPK pathway similar to the typical p.Gly12Ser and p.Gly12Ala mutations. Recombinant HRAS p.Lys117Arg demonstrates normal intrinsic GTP hydrolysis and responsiveness to GTPase-activating proteins, but the nucleotide dissociation rate is increased 80-fold. Consistent with the biochemical data, the crystal structure of the p.Lys117Arg mutant indicates an altered interaction pattern of the side chain that is associated with unfavorable nucleotide binding properties. Together, these data show that a RAS mutation that only perturbs guanine nucleotide binding has similar functional consequences as mutations that impair GTP hydrolysis and causes human disease.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "experimental", "rank": 9, "why": "Experimental query matched HRAS, Costello, codon 12.", "passage": "De novo heterozygous missense mutations in HRAS codon 12 and 13 disturbing the intrinsic GTP hydrolysis cause Costello syndrome.", "matched_terms": ["HRAS", "Costello", "codon 12"]}], "in_packet": false, "in_budget": ["experimental"]}, {"pmid": "18823404", "year": 2009, "date": "2008-09-22", "title": "Germline expression of H-Ras(G12V) causes neurological deficits associated to Costello syndrome.", "abstract": "Costello syndrome (CS) is a rare congenital disorder caused by germline activation of H-Ras oncogenes. A mouse model of CS generated by introduction of an oncogenic Gly12Val mutation in the mouse H-Ras locus using homologous recombination in embryonic stem (ES) cells has been recently described. These mice phenocopied some of the abnormalities observed in patients with CS, including facial dysmorphia and cardiomyopathies. We investigated here their neurological and behavioral phenotype. The analysis of H-Ras(G12V) mice revealed phenotypes that resembled the hyperemotivity, hypersensibility and cognitive impairments observed in children with CS. Stronger neurological deficits were found in the analysis of mice homozygous for this mutation than in the analysis of heterozygous mice, suggesting the existence of a gene dose effect. These mice represent the first mouse model for CS, offering an experimental tool to study the molecular and physiological alterations underlying the neurological manifestations of CS and to test new therapies aimed at preventing or ameliorating the cognitive and emotional impairments associated to this condition.", "pub_types": ["Research Support, Non-U.S. Gov't", "Journal Article"], "relationships": [{"type": "text_similarity", "rank": 16, "why": "Cosine 0.94 between this abstract and the claim statement.", "passage": "Costello syndrome (CS) is a rare congenital disorder caused by germline activation of H-Ras oncogenes.", "matched_terms": ["Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}, {"pmid": "19132118", "year": 2009, "date": "2008-12-22", "title": "Expression of H-RASV12 in a zebrafish model of Costello syndrome causes cellular senescence in adult proliferating cells.", "abstract": "Constitutively active, 'oncogenic' H-RAS can drive proliferation and transformation in human cancer, or be a potent inducer of cellular senescence. Moreover, aberrant activation of the Ras pathway owing to germline mutations can cause severe developmental disorders. In this study we have generated transgenic zebrafish that constitutively express low levels, or can be induced to express high levels, of oncogenic H-RAS. We observed that fish carrying the integrated transgene in their germline display several hallmarks of Costello syndrome, a rare genetic disease caused by activating mutations in the gene H-RAS, and can be used as a model for the disease. In Costello-like fish, low levels of oncogenic H-RAS expression are associated with both reduced proliferation and an increase in senescence markers in adult progenitor cell compartments in the brain and heart, together with activated DNA damage responses. Overexpression of H-RAS through a heat-shock-inducible promoter in larvae led to hyperproliferation, activation of the DNA damage response and tp53-dependent cell cycle arrest. Thus, oncogene-induced senescence of adult proliferating cells contributes to the development of Costello syndrome and provides an alternative pathway to transformation in the presence of widespread constitutively active H-RAS expression.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article"], "relationships": [{"type": "text_similarity", "rank": 18, "why": "Cosine 0.92 between this abstract and the claim statement.", "passage": "We observed that fish carrying the integrated transgene in their germline display several hallmarks of Costello syndrome, a rare genetic disease caused by activating mutations in the gene H-RAS, and can be used as a model for the disease.", "matched_terms": ["Costello"]}], "in_packet": false, "in_budget": ["text_similarity"]}, {"pmid": "19206169", "year": 2009, "date": "2009-04-01", "title": "Germline BRAF mutations in Noonan, LEOPARD, and cardiofaciocutaneous syndromes: molecular diversity and associated phenotypic spectrum.", "abstract": "Noonan, LEOPARD, and cardiofaciocutaneous syndromes (NS, LS, and CFCS) are developmental disorders with overlapping features including distinctive facial dysmorphia, reduced growth, cardiac defects, skeletal and ectodermal anomalies, and variable cognitive deficits. Dysregulated RAS-mitogen-activated protein kinase (MAPK) signal traffic has been established to represent the molecular pathogenic cause underlying these conditions. To investigate the phenotypic spectrum and molecular diversity of germline mutations affecting BRAF, which encodes a serine/threonine kinase functioning as a RAS effector frequently mutated in CFCS, subjects with a diagnosis of NS (N=270), LS (N=6), and CFCS (N=33), and no mutation in PTPN11, SOS1, KRAS, RAF1, MEK1, or MEK2, were screened for the entire coding sequence of the gene. Besides the expected high prevalence of mutations observed among CFCS patients (52%), a de novo heterozygous missense change was identified in one subject with LS (17%) and five individuals with NS (1.9%). Mutations mapped to multiple protein domains and largely did not overlap with cancer-associated defects. NS-causing mutations had not been documented in CFCS, suggesting that the phenotypes arising from germline BRAF defects might be allele specific. Selected mutant BRAF proteins promoted variable gain of function of the kinase, but appeared less activating compared to the recurrent cancer-associated p.Val600Glu mutant. Our findings provide evidence for a wide phenotypic diversity associated with mutations affecting BRAF, and occurrence of a clinical continuum associated with these molecular lesions.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "citation", "rank": 5, "why": "Cites PMID 16372351. The abstract does not state the claim's setting or focus terms.", "passage": "Noonan, LEOPARD, and cardiofaciocutaneous syndromes (NS, LS, and CFCS) are developmental disorders with overlapping features including distinctive facial dysmorphia, reduced growth, cardiac defects, skeletal and ectodermal anomalies, and variable cognitive deficits.", "matched_terms": []}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "19206176", "year": 2009, "date": "2009-03-01", "title": "Male-to-male transmission of Costello syndrome: G12S HRAS germline mutation inherited from a father with somatic mosaicism.", "abstract": "Costello syndrome is a rare congenital anomaly syndrome associated with mental retardation and predisposition to benign and malignant tumors, caused by heterozygous missense mutations in the HRAS oncogene. Previously, all molecularly analyzed mutations appeared de novo, and most arose in the paternal germline. A single patient with somatic mosaicism for a Costello syndrome causing HRAS mutation has been reported. Here we describe the first documented transmission of an HRAS mutation from a parent with somatic mosaicism to a child with typical Costello syndrome. Prior to the identification of the underlying gene mutation in Costello syndrome, this family had been identified clinically. The proband was subsequently found to carry a G12S HRAS germline mutation. Testing of the parents for parental origin identified his father as mosaic for the same HRAS mutation. The mother was found not to carry an HRAS mutation. The causative familial mutation is identified as a c.34G > A, which is the most common mutation in the HRAS gene in patients with Costello syndrome. The father carries the mutation in 7-8% of his alleles. This is the second case of mosaicism observed in Costello syndrome and the first direct molecular evidence of father-to-son transmission of the disease-causing mutation. Our observation underlines the importance of parental evaluation, and may have implications for genetic counseling and clinical practice.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "citation", "rank": 4, "why": "Cites PMID 16372351. Matched terms: HRAS, Costello.", "passage": "Costello syndrome is a rare congenital anomaly syndrome associated with mental retardation and predisposition to benign and malignant tumors, caused by heterozygous missense mutations in the HRAS oncogene.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["combination", "citation"]}, {"pmid": "20979192", "year": 2010, "date": "2010-11-01", "title": "Costello syndrome with severe cutis laxa and mosaic HRAS G12S mutation.", "abstract": "Costello syndrome is a rare developmental disorder characterized by coarse face, postnatal growth retardation, skin and musculoskeletal anomalies, cardiovascular abnormalities, mental retardation, and tumor predisposition. Dermatological manifestations usually include redundant, soft and thickened skin. Loose skin is especially present over the neck, hands, and feet. Heterozygous missense mutations in HRAS are causative for Costello syndrome, with the c.34G > A (p.G12S) mutation as the most commonly found alteration. In the majority of affected individuals pathogenic sequence changes appeared de novo, however, two individuals with somatic mosaicism for the HRAS mutation have been reported. Here, we describe a boy with somatic mosaicism for the c.34G > A mutation in HRAS. Allelic quantitation revealed the mutation in approximately 58% of his lymphocytes; however, in DNA derived from buccal cells we could not detect the sequence change. The patient presented with the typical clinical findings of Costello syndrome such as increased birth weight, severe failure to thrive, characteristic facial appearance, and skin abnormalities. The dermatological anomalies were remarkable as he showed severe skin laxity with wrinkling of skin on all parts of the body due to loss of subcutaneous fat that decreased significantly by age 13 months. This case further adds to the phenotypic variability seen in patients with somatic mosaicism for an HRAS mutation and highlights the awareness of mosaic mutations in Costello syndrome when molecular testing is performed.", "pub_types": ["Journal Article", "Case Reports"], "relationships": [{"type": "text_similarity", "rank": 3, "why": "Cosine 0.97 between this abstract and the claim statement.", "passage": "Heterozygous missense mutations in HRAS are causative for Costello syndrome, with the c.34G > A (p.G12S) mutation as the most commonly found alteration.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["combination", "text_similarity"]}, {"pmid": "21078999", "year": 2010, "date": "2010-11-15", "title": "Multiple oncogenic mutations and clonal relationship in spatially distinct benign human epidermal tumors.", "abstract": "Malignant tumors result from the accumulation of genetic alterations in oncogenes and tumor suppressor genes. Much less is known about the genetic changes in benign tumors. Seborrheic keratoses (SK) are very frequent benign human epidermal tumors without malignant potential. We performed a comprehensive mutational screen of genes in the FGFR3-RAS-MAPK and phosphoinositide 3-kinase (PI3K)-AKT pathways from 175 SK, including multiple lesions from each patient. SK commonly harbored multiple bona fide oncogenic mutations in FGFR3, PIK3CA, KRAS, HRAS, EGFR, and AKT1 oncogenes but not in tumor suppressor genes TSC1 and PTEN. Despite the occurrence of oncogenic mutations and the evidence for downstream ERK/MAPK and PI3K pathway signaling, we did not find induction of senescence or a DNA damage response. Array comparative genomic hybridization (aCGH) analysis revealed that SK are genetically stable. The pattern of oncogenic mutations and X chromosome inactivation departs significantly from randomness and indicates that spatially independent lesions from a given patient share a clonal relationship. Our findings show that multiple oncogenic mutations in the major signaling pathways involved in cancer are not sufficient to drive malignant tumor progression. Furthermore, our data provide clues on the origin and spread of oncogenic mutations in tissues, suggesting that apparently independent (multicentric) adult benign tumors may have a clonal origin.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article"], "relationships": [{"type": "experimental", "rank": 13, "why": "Experimental query matched HRAS.", "passage": "SK commonly harbored multiple bona fide oncogenic mutations in FGFR3, PIK3CA, KRAS, HRAS, EGFR, and AKT1 oncogenes but not in tumor suppressor genes TSC1 and PTEN.", "matched_terms": ["HRAS"]}], "in_packet": false, "in_budget": ["experimental"]}, {"pmid": "20949621", "year": 2011, "date": "2010-12-09", "title": "Germline KRAS mutations cause aberrant biochemical and physical properties leading to developmental disorders.", "abstract": "The KRAS gene is the most common locus for somatic gain-of-function mutations in human cancer. Germline KRAS mutations were shown recently to be associated with developmental disorders, including Noonan syndrome (NS), cardio-facio-cutaneous syndrome (CFCS), and Costello syndrome (CS). The molecular basis of this broad phenotypic variability has in part remained elusive so far. Here, we comprehensively analyzed the biochemical and structural features of ten germline KRAS mutations using physical and cellular biochemistry. According to their distinct biochemical and structural alterations, the mutants can be grouped into five distinct classes, four of which markedly differ from RAS oncoproteins. Investigated functional alterations comprise the enhancement of intrinsic and guanine nucleotide exchange factor (GEF) catalyzed nucleotide exchange, which is alternatively accompanied by an impaired GTPase-activating protein (GAP) stimulated GTP hydrolysis, an overall loss of functional properties, and a deficiency in effector interaction. In conclusion, our data underscore the important role of RAS in the pathogenesis of the group of related disorders including NS, CFCS, and CS, and provide clues to the high phenotypic variability of patients with germline KRAS mutations.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article"], "relationships": [{"type": "citation", "rank": 7, "why": "Cites PMID 16372351. Matched terms: Costello.", "passage": "Germline KRAS mutations were shown recently to be associated with developmental disorders, including Noonan syndrome (NS), cardio-facio-cutaneous syndrome (CFCS), and Costello syndrome (CS).", "matched_terms": ["Costello"]}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "21068439", "year": 2011, "date": "2010-11-10", "title": "Development of severe skeletal defects in induced SHP-2-deficient adult mice: a model of skeletal malformation in humans with SHP-2 mutations.", "abstract": "SHP-2 (encoded by PTPN11) is a ubiquitously expressed protein tyrosine phosphatase required for signal transduction by multiple different cell surface receptors. Humans with germline SHP-2 mutations develop Noonan syndrome or LEOPARD syndrome, which are characterized by cardiovascular, neurological and skeletal abnormalities. To study how SHP-2 regulates tissue homeostasis in normal adults, we used a conditional SHP-2 mouse mutant in which loss of expression of SHP-2 was induced in multiple tissues in response to drug administration. Induced deletion of SHP-2 resulted in impaired hematopoiesis, weight loss and lethality. Most strikingly, induced SHP-2-deficient mice developed severe skeletal abnormalities, including kyphoses and scolioses of the spine. Skeletal malformations were associated with alterations in cartilage and a marked increase in trabecular bone mass. Osteoclasts were essentially absent from the bones of SHP-2-deficient mice, thus accounting for the osteopetrotic phenotype. Studies in vitro revealed that osteoclastogenesis that was stimulated by macrophage colony-stimulating factor (M-CSF) and receptor activator of nuclear factor kappa B ligand (RANKL) was defective in SHP-2-deficient mice. At least in part, this was explained by a requirement for SHP-2 in M-CSF-induced activation of the pro-survival protein kinase AKT in hematopoietic precursor cells. These findings illustrate an essential role for SHP-2 in skeletal growth and remodeling in adults, and reveal some of the cellular and molecular mechanisms involved. The model is predicted to be of further use in understanding how SHP-2 regulates skeletal morphogenesis, which could lead to the development of novel therapies for the treatment of skeletal malformations in human patients with SHP-2 mutations.", "pub_types": ["research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "citation", "rank": 9, "why": "Cites PMID 16372351. The abstract does not state the claim's setting or focus terms.", "passage": "SHP-2 (encoded by PTPN11) is a ubiquitously expressed protein tyrosine phosphatase required for signal transduction by multiple different cell surface receptors.", "matched_terms": []}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "21438134", "year": 2011, "date": "2011-03-15", "title": "Phenotypic analysis of individuals with Costello syndrome due to HRAS p.G13C.", "abstract": "Costello syndrome is characterized by severe failure-to-thrive, short stature, cardiac abnormalities (heart defects, tachyarrhythmia, and hypertrophic cardiomyopathy (HCM)), distinctive facial features, a predisposition to papillomata and malignant tumors, postnatal cerebellar overgrowth resulting in Chiari 1 malformation, and cognitive disabilities. De novo germline mutations in the proto-oncogene HRAS cause Costello syndrome. Most mutations affect the glycine residues in position 12 or 13, and more than 80% of patients share p.G12S. To test the hypothesis that subtle genotype-phenotype differences exist, we report the first cohort comparison between 12 Costello syndrome individuals with p.G13C and individuals with p.G12S. The individuals with p.G13C had many typical findings including polyhydramnios, failure-to-thrive, HCM, macrocephaly with posterior fossa crowding, and developmental delay. Subjectively, their facial features were less coarse. Statistically significant differences included the absence of multifocal atrial tachycardia (P-value = 0.033), ulnar deviation of the wrist (P \u003c 0.001) and papillomata (P = 0.003), and fewer neurosurgical procedures (P = 0.024). Fewer individuals with p.G13C had short stature (height below -2 SD) without use of growth hormone (P \u003c 0.001). The noteworthy absence of malignant tumors did not reach statistical significance. Novel ectodermal findings were noted in individuals with p.G13C, including loose anagen hair resulting in easily pluckable hair with a matted appearance, different from the tight curls typical for most Costello syndrome individuals. Unusually long eye lashes requiring trimming are a novel finding we termed dolichocilia. These distinctive ectodermal findings suggest a cell type specific effect of this particular mutation. Additional patients are needed to validate these findings.", "pub_types": ["Research Support, Non-U.S. Gov't", "research-article", "Journal Article", "Research Support, N.I.H., Extramural"], "relationships": [{"type": "citation", "rank": 10, "why": "Cites PMID 16372351. Matched terms: HRAS, Costello.", "passage": "De novo germline mutations in the proto-oncogene HRAS cause Costello syndrome.", "matched_terms": ["HRAS", "Costello"]}], "in_packet": false, "in_budget": ["citation"]}, {"pmid": "21779495", "year": 2011, "date": "2011-03-01", "title": "Functional specificity of ras isoforms: so similar but so different.", "abstract": "H-ras, N-ras, and K-ras are canonical ras gene family members frequently activated by point mutation in human cancers and coding for 4 different, highly related protein isoforms (H-Ras, N-Ras, K-Ras4A, and K-Ras4B). Their expression is nearly ubiquitous and broadly conserved across eukaryotic species, although there are quantitative and qualitative differences of expression depending on the tissue and/or developmental stage under consideration. Extensive functional studies have determined during the last quarter century that these Ras gene products are critical components of signaling pathways that control eukaryotic cell proliferation, survival, and differentiation. However, because of their homology and frequent coexpression in various cellular contexts, it remained unclear whether the different Ras proteins play specific or overlapping functional roles in physiological and pathological processes. Initially, their high degree of sequence homology and the observation that all Ras isoforms share common sets of downstream effectors and upstream activators suggested that they were mostly redundant functionally. In contrast, the notion of functional specificity for each of the different Ras isoforms is supported at present by an increasing body of experimental observations, including 1) the fact that different ras isoforms are preferentially mutated in specific types of tumors or developmental disorders; 2) the different transforming potential of transfected ras genes in different cell contexts; 3) the distinct sensitivities exhibited by the various Ras family members for modulation by different GAPs or GEFs; 4) the demonstration that different Ras isoforms follow distinct intracellula
